<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>种子图书馆小账本</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f6f1e7; color: #1c1915; font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif; }
  main { width: min(48rem, calc(100% - 1.5rem)); margin: 0 auto; padding: 1rem 0 2rem; }
  h1 { font-size: 1.7rem; margin: 0.2rem 0; }
  .banner { background: #efe2c9; padding: 0.6rem 0.75rem; }
  .quiet { color: #5e564c; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 0.7rem; margin: 0.8rem 0; }
  .card { background: #fffdf8; border: 1px solid #d9cbb6; padding: 0.75rem; }
  .stock { font-size: 2rem; margin: 0.2rem 0; }
  button, select, input { font: inherit; }
  button { background: #1c1915; color: #fffdf8; border: 0; padding: 0.5rem 0.7rem; margin: 0 0.4rem 0.4rem 0; }
  select, input { background: #fffdf8; border: 1px solid #1c1915; padding: 0.4rem; max-width: 100%; }
  form { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: end; }
  label { display: grid; gap: 0.2rem; }
  .bad { color: #9c3b32; }
  .undone { text-decoration: line-through; color: #5e564c; }
  ul { padding-left: 1.1rem; }
  svg { width: 4.5rem; height: auto; }
</style>
</head>
<body>
<main>
  <p class="quiet">问笺馆原创。受公开方法资料启发，不是那些网站的官方题目，也不代表对方背书。</p>
  <h1>种子图书馆小账本</h1>
  <p class="banner" id="banner">合成数据。账记在这台浏览器的本地保存里，不上传。这页不收集姓名。</p>
  <div id="cards" class="cards"></div>
  <h2>演示四步</h2>
  <p class="quiet">每按一次只做那一步，按当前库存真的改，不是播一段写好的结果。</p>
  <p>
    <button type="button" id="demo-1">1 借出豆星 2</button>
    <button type="button" id="demo-2">2 再借豆星 2</button>
    <button type="button" id="demo-3">3 归还月瓜 2</button>
    <button type="button" id="demo-4">4 撤销上一个有效动作</button>
  </p>
  <h2>自己记一笔</h2>
  <form id="form">
    <label>种类
      <select id="item"></select>
    </label>
    <label>动作
      <select id="kind">
        <option value="borrow">借出</option>
        <option value="return">归还</option>
      </select>
    </label>
    <label>数量
      <input id="qty" inputmode="numeric" autocomplete="off">
    </label>
    <button type="submit">写入</button>
  </form>
  <p>
    <button type="button" id="undo">撤销上一个有效动作</button>
    <button type="button" id="reset">重置</button>
    <button type="button" id="download">下载 ledger.json</button>
  </p>
  <p id="note" aria-live="polite"></p>
  <label>事件筛选
    <select id="filter">
      <option value="all">全部种类</option>
    </select>
  </label>
  <ul id="events"></ul>
</main>
<script>
const KEY = "orig-n07-seed-ledger"
const INITIAL = { "豆星": 3, "月瓜": 1 }
const SEED = `<svg viewBox="0 0 64 40" aria-hidden="true"><ellipse cx="16" cy="22" rx="12" ry="8" fill="#c4493a"/><ellipse cx="42" cy="18" rx="14" ry="9" fill="#e2b656"/></svg>`

function fresh(note) {
  return { initial: { ...INITIAL }, events: [], undos: [], note: note || "最初库存：豆星 3，月瓜 1。" }
}

function load() {
  const raw = localStorage.getItem(KEY)
  if (!raw) return fresh()
  try {
    const data = JSON.parse(raw)
    if (!data || !Array.isArray(data.events) || !data.initial) return fresh()
    return data
  } catch (error) {
    return fresh()
  }
}

let state = load()

function stockOf(source) {
  const stock = { ...source.initial }
  for (const event of source.events) {
    if (event.undone) continue
    if (event.type === "borrow") stock[event.item] -= event.qty
    else stock[event.item] += event.qty
  }
  return stock
}

function parseQty(text) {
  if (typeof text !== "string" || !/^[1-9]\d*$/.test(text.trim())) return null
  return Number(text.trim())
}

function save() {
  localStorage.setItem(KEY, JSON.stringify(state))
}

function ledger() {
  return {
    synthetic: true,
    savedIn: "localStorage",
    collectsName: false,
    initial: state.initial,
    events: state.events,
    undos: state.undos,
    current: stockOf(state)
  }
}

function render() {
  const stock = stockOf(state)
  const names = Object.keys(state.initial)
  document.getElementById("cards").innerHTML = names.map((name) => `<article class="card" data-item="${name}" data-stock="${stock[name]}">${SEED}<h3>${name}</h3><p class="stock">${stock[name]}</p><p class="quiet">当前库存</p></article>`).join("")
  const itemSelect = document.getElementById("item")
  const previous = itemSelect.value
  itemSelect.innerHTML = names.map((name) => `<option value="${name}">${name}</option>`).join("")
  if (names.includes(previous)) itemSelect.value = previous
  const filter = document.getElementById("filter")
  const previousFilter = filter.value || "all"
  filter.innerHTML = `<option value="all">全部种类</option>` + names.map((name) => `<option value="${name}">${name}</option>`).join("")
  filter.value = [...filter.options].some((option) => option.value === previousFilter) ? previousFilter : "all"
  const shown = state.events.filter((event) => filter.value === "all" || event.item === filter.value)
  document.getElementById("events").innerHTML = shown.map((event) => {
    const word = event.type === "borrow" ? "借出" : "归还"
    return `<li class="${event.undone ? "undone" : ""}" data-seq="${event.seq}" data-undone="${event.undone}">${word} ${event.item} ${event.qty}${event.undone ? "（已撤销）" : ""}</li>`
  }).join("") || "<li>还没有有效事件。</li>"
  const note = document.getElementById("note")
  note.textContent = state.note || ""
  note.className = state.rejected ? "bad" : ""
  document.body.dataset.events = String(state.events.length)
  document.body.dataset.active = String(state.events.filter((event) => !event.undone).length)
  window.__ledger = ledger()
}

function reject(message) {
  state.note = message
  state.rejected = true
  save()
  render()
  return false
}

function applyAction(type, item, qty) {
  if (!Object.prototype.hasOwnProperty.call(state.initial, item)) return reject("没有这个种类，未写入。")
  if (qty === null) return reject("数量不是正整数，未写入。")
  const stock = stockOf(state)
  if (type === "borrow" && stock[item] < qty) return reject(`库存不够：${item} 只有 ${stock[item]}，这一笔未写入。`)
  const event = { seq: (state.events.at(-1)?.seq || 0) + 1, type, item, qty, undone: false }
  state.events.push(event)
  state.rejected = false
  state.note = type === "borrow" ? `已借出 ${item} ${qty}。` : `已归还 ${item} ${qty}。`
  save()
  render()
  return true
}

function undo() {
  const event = [...state.events].reverse().find((item) => !item.undone)
  if (!event) return reject("没有可撤销的有效动作。")
  event.undone = true
  const word = event.type === "borrow" ? "借出" : "归还"
  const note = `撤销了${word} ${event.item} ${event.qty}。只撤这一个有效动作，更早的记录还在。`
  state.undos.push({ seq: event.seq, note })
  state.rejected = false
  state.note = note
  save()
  render()
  return true
}

function reset() {
  state = fresh("已重置。库存回到豆星 3、月瓜 1，事件已清空。")
  save()
  render()
}

document.getElementById("demo-1").addEventListener("click", () => applyAction("borrow", "豆星", 2))
document.getElementById("demo-2").addEventListener("click", () => applyAction("borrow", "豆星", 2))
document.getElementById("demo-3").addEventListener("click", () => applyAction("return", "月瓜", 2))
document.getElementById("demo-4").addEventListener("click", undo)
document.getElementById("undo").addEventListener("click", undo)
document.getElementById("reset").addEventListener("click", reset)
document.getElementById("filter").addEventListener("change", render)
document.getElementById("form").addEventListener("submit", (event) => {
  event.preventDefault()
  applyAction(document.getElementById("kind").value, document.getElementById("item").value, parseQty(document.getElementById("qty").value))
})
document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(ledger(), null, 2) + "\n"], { type: "application/json" })
  const link = document.createElement("a")
  link.href = URL.createObjectURL(blob)
  link.download = "ledger.json"
  link.click()
  URL.revokeObjectURL(link.href)
})

render()
</script>
</body>
</html>
