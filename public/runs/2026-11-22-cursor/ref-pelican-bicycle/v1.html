<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pelican riding a bicycle</title>
<style>
  html, body { margin: 0; height: 100%; background: #d7ebf6; }
  svg { width: 100%; height: 100%; display: block; }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<svg id="scene" viewBox="0 0 800 460" role="img" aria-label="A pelican pedaling a bicycle">
  <rect width="800" height="460" fill="#d7ebf6"/>
  <ellipse cx="400" cy="430" rx="360" ry="18" fill="#c5d59a"/>
  <g id="bike" transform="translate(0 0)">
    <g class="wheel" transform="translate(230 320)">
      <circle r="68" fill="none" stroke="#1d1916" stroke-width="8"/>
      <g class="spin"><g stroke="#1d1916" stroke-width="3">
        <line x1="0" y1="-60" x2="0" y2="60"/>
        <line x1="-60" y1="0" x2="60" y2="0"/>
        <line x1="-42" y1="-42" x2="42" y2="42"/>
        <line x1="-42" y1="42" x2="42" y2="-42"/>
      </g><circle r="8" fill="#1d1916"/></g>
    </g>
    <g class="wheel" transform="translate(560 320)">
      <circle r="68" fill="none" stroke="#1d1916" stroke-width="8"/>
      <g class="spin"><g stroke="#1d1916" stroke-width="3">
        <line x1="0" y1="-60" x2="0" y2="60"/>
        <line x1="-60" y1="0" x2="60" y2="0"/>
        <line x1="-42" y1="-42" x2="42" y2="42"/>
        <line x1="-42" y1="42" x2="42" y2="-42"/>
      </g><circle r="8" fill="#1d1916"/></g>
    </g>
    <path d="M230 320 L390 320 L470 200 L330 200 L250 320 M390 320 L470 320 L560 320" fill="none" stroke="#c4493a" stroke-width="8" stroke-linejoin="round"/>
    <path d="M470 200 L500 150" stroke="#1d1916" stroke-width="6"/>
    <path d="M470 150 H540" stroke="#1d1916" stroke-width="6" stroke-linecap="round"/>
    <g id="crank" transform="translate(390 320)"></g>
  </g>
  <g id="bird">
    <ellipse cx="360" cy="168" rx="78" ry="46" fill="#f4f1ea" stroke="#1d1916" stroke-width="3"/>
    <ellipse cx="300" cy="150" rx="28" ry="22" fill="#f4f1ea" stroke="#1d1916" stroke-width="3"/>
    <path d="M274 150 L210 142 L274 164 Z" fill="#e2b656" stroke="#1d1916" stroke-width="3"/>
    <path d="M250 164 Q230 210 270 200 Q290 170 274 164" fill="#f2c7a5" stroke="#1d1916" stroke-width="3"/>
    <circle cx="292" cy="146" r="3" fill="#1d1916"/>
    <path d="M430 140 Q520 80 470 170 Q430 160 430 140" fill="#d9efe8" stroke="#1d1916" stroke-width="3"/>
    <line id="legL" x1="350" y1="200" x2="390" y2="320" stroke="#e2b656" stroke-width="6" stroke-linecap="round"/>
    <line id="legR" x1="380" y1="200" x2="390" y2="320" stroke="#c9845a" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
<script>
(function () {
  var crank = document.getElementById("crank");
  var legL = document.getElementById("legL");
  var legR = document.getElementById("legR");
  var angle = 0;
  function frame() {
    angle += 0.06;
    var lx = Math.cos(angle) * 28;
    var ly = Math.sin(angle) * 28;
    var rx = Math.cos(angle + Math.PI) * 28;
    var ry = Math.sin(angle + Math.PI) * 28;
    crank.innerHTML = '<line x1="' + lx + '" y1="' + ly + '" x2="' + rx + '" y2="' + ry + '" stroke="#1d1916" stroke-width="6" stroke-linecap="round"/>' +
      '<circle cx="' + lx + '" cy="' + ly + '" r="7" fill="#2c4a6e"/>' +
      '<circle cx="' + rx + '" cy="' + ry + '" r="7" fill="#2c4a6e"/>';
    legL.setAttribute("x2", 390 + lx);
    legL.setAttribute("y2", 320 + ly);
    legR.setAttribute("x2", 390 + rx);
    legR.setAttribute("y2", 320 + ry);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
