<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solar system</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b16; }
  svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<svg id="sky" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#070b16"/>
  <circle id="sun" cx="400" cy="300" r="28" fill="#f4d36a"/>
  <g id="mercury" data-name="mercury" data-period="87.97" data-radius="70"><circle r="5" fill="#c4b8a5"/></g>
  <g id="venus" data-name="venus" data-period="224.7" data-radius="110"><circle r="8" fill="#e6c07b"/></g>
  <g id="earth" data-name="earth" data-period="365.25" data-radius="150"><circle r="9" fill="#4c8dff"/></g>
  <g id="mars" data-name="mars" data-period="686.98" data-radius="190"><circle r="7" fill="#c4493a"/></g>
  <g id="jupiter" data-name="jupiter" data-period="4332.6" data-radius="250"><circle r="16" fill="#d9b48f"/></g>
</svg>
<script>
(function () {
  var planets = Array.prototype.slice.call(document.querySelectorAll("g[data-period]"));
  var start = performance.now();
  function place(now) {
    var days = (now - start) / 40;
    planets.forEach(function (planet) {
      var period = Number(planet.getAttribute("data-period"));
      var radius = Number(planet.getAttribute("data-radius"));
      var angle = (days / period) * Math.PI * 2;
      var x = 400 + Math.cos(angle) * radius;
      var y = 300 + Math.sin(angle) * radius;
      planet.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")");
      planet.dataset.angle = String(angle);
    });
    requestAnimationFrame(place);
  }
  requestAnimationFrame(place);
})();
</script>
</body>
</html>
