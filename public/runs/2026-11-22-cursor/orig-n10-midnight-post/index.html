<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>午夜邮局</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f6f1e7; color: #1c1915; font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif; }
  main { width: min(40rem, calc(100% - 1.5rem)); margin: 0 auto; padding: 1rem 0 2rem; }
  h1 { font-size: 1.7rem; }
  .quiet { color: #5e564c; }
  article { background: #fffdf8; border: 1px solid #d9cbb6; padding: 0.9rem; }
  p { line-height: 1.7; }
  button { font: inherit; background: #1c1915; color: #fffdf8; border: 0; padding: 0.5rem 0.7rem; margin: 0.35rem 0.4rem 0.35rem 0; }
  button:disabled { background: #8a8175; }
  .reason { color: #9c3b32; }
  :focus { outline: 3px solid #9c3b32; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="quiet">问笺馆原创。受公开方法资料启发，不是那些网站的官方题目，也不代表对方背书。文学好不好是主观意见，不写进客观通过。</p>
  <h1>午夜邮局</h1>
  <p id="status"></p>
  <article>
    <h2 id="label"></h2>
    <p id="prose"></p>
    <div id="choices"></div>
    <p id="reason" class="reason" hidden></p>
  </article>
  <p>
    <button type="button" id="back">后退</button>
    <button type="button" id="reset">重读</button>
    <button type="button" id="download">下载 reading-log.json</button>
  </p>
  <h2>这一路</h2>
  <ol id="path"></ol>
</main>
<script type="application/json" id="story">{
  "title": "午夜邮局",
  "initial": {
    "stamps": 1
  },
  "subjectiveNote": "句子是否动人是主观意见，不作为客观通过的依据。",
  "nodes": {
    "A": {
      "label": "门厅",
      "text": "纸鸥邮差把读者领进午夜的门厅。油灯只照亮半圈石砖，窗外灯塔的光一闪一闪扫过脚边。读者捏着那枚还没贴上的邮票，空白信纸在口袋里发潮。守灯人没有下来。邮差压低声音，说柜台和灯塔都还开着，先走哪一边，由读者自己定。",
      "choices": [
        {
          "text": "先去柜台",
          "to": "B"
        },
        {
          "text": "先看灯塔",
          "to": "C"
        }
      ]
    },
    "B": {
      "label": "柜台",
      "text": "柜台后没有人影，只有一枚铜铃和一本摊开的夜班册。纸鸥邮差用喙尖点了点册页，告诉读者这枚邮票只能用一次。若现在寄出第一封信，地址可以先空着，灯塔那边会替你收。若把邮票留着，信就还在你手里，分信台那边也许还能改主意。",
      "choices": [
        {
          "text": "寄出第一封信",
          "to": "D",
          "spend": 1
        },
        {
          "text": "把邮票留着",
          "to": "D",
          "spend": 0
        }
      ]
    },
    "C": {
      "label": "灯塔",
      "text": "灯塔的螺旋梯又窄又潮。守灯人坐在顶层，手里托着一盏不再摇晃的灯。纸鸥邮差停在窗沿，没有催读者做决定。守灯人说，天亮以前他都会在这里。读者可以跟着邮差回柜台，也可以留下来，看这盏灯怎样把黑夜一寸寸守完。",
      "choices": [
        {
          "text": "回柜台",
          "to": "B"
        },
        {
          "text": "陪守灯人等天亮",
          "to": "E1"
        }
      ]
    },
    "D": {
      "label": "分信台",
      "text": "分信台靠着一扇朝海的窗，夜风把未写完的地址吹得发皱。纸鸥邮差把两只爪子分开，一边是明天的邮袋，一边是窗外的黑暗。邮票若还在，信可以交给明天。邮票若已经贴出去，明天的邮袋就不再打开。读者也可以把信读给海风，让它离开邮路。",
      "choices": [
        {
          "text": "寄给明天",
          "to": "E2",
          "requires_stamps": 1,
          "spend": 1
        },
        {
          "text": "把信读给海风",
          "to": "E3"
        }
      ]
    },
    "E1": {
      "label": "结局：守候",
      "text": "守灯人把灯芯拨亮了一点，纸鸥邮差收起翅膀，和读者一起坐到天亮。信没有离开口袋，邮票也还在。海面慢慢显出一条浅色的边。守候本身就是结局：没有寄出，没有丢弃，只是把这一夜陪完。邮差在晨光里点头，不再询问下一站。",
      "choices": []
    },
    "E2": {
      "label": "结局：送达",
      "text": "纸鸥邮差把信放进标着明天的邮袋，邮票正好用完。守灯人从高处看见那只邮袋被夜风托起，又稳稳落下。读者站在分信台，知道这封信不会留在今夜。送达的意思很具体：它被交给了下一个黎明，而不是留在手里，也不是散进风中。",
      "choices": []
    },
    "E3": {
      "label": "结局：放下",
      "text": "读者把信纸展开，对着窗外的海风逐字读完。纸鸥邮差没有去拦，守灯人只是把灯转开一些。读到最后一句，信纸被风卷出窗格，不见了。这不是寄达，也不是留下陪伴。放下的结局是：话已经说给夜里，信不再属于邮路。",
      "choices": []
    }
  }
}</script>
<script>
const STORY = JSON.parse(document.getElementById("story").textContent)
const BLOCKED = "邮票已经用过，不能再寄给明天。"

function fresh() {
  return { node: "A", stamps: STORY.initial.stamps, path: ["A"], steps: [] }
}

let state = fresh()
const history = []

function endingOf(node) {
  return node.startsWith("E") ? node : null
}

function logSnapshot() {
  return {
    title: STORY.title,
    steps: state.steps.map((step) => ({ ...step })),
    path: state.path.slice(),
    node: state.node,
    stamps: state.stamps,
    ending: endingOf(state.node)
  }
}

function render() {
  const node = STORY.nodes[state.node]
  document.getElementById("label").textContent = `${state.node} ${node.label}`
  document.getElementById("prose").textContent = node.text
  document.getElementById("status").textContent = `邮票 ${state.stamps} 枚`
  document.body.dataset.node = state.node
  document.body.dataset.stamps = String(state.stamps)
  const box = document.getElementById("choices")
  box.textContent = ""
  const reason = document.getElementById("reason")
  reason.hidden = true
  reason.textContent = ""
  node.choices.forEach((choice, index) => {
    const button = document.createElement("button")
    button.type = "button"
    button.textContent = choice.text
    button.dataset.to = choice.to
    button.dataset.index = String(index)
    const needs = choice.requires_stamps || 0
    if (state.stamps < needs) {
      button.disabled = true
      button.setAttribute("aria-describedby", "reason")
      reason.hidden = false
      reason.textContent = BLOCKED
    }
    button.addEventListener("click", () => choose(index))
    box.append(button)
  })
  document.getElementById("path").textContent = ""
  for (const id of state.path) {
    const item = document.createElement("li")
    item.textContent = `${id} ${STORY.nodes[id].label}`
    document.getElementById("path").append(item)
  }
  document.getElementById("back").disabled = history.length === 0
  window.__log = logSnapshot()
}

function choose(index) {
  const choice = STORY.nodes[state.node].choices[index]
  const needs = choice.requires_stamps || 0
  if (state.stamps < needs) return
  history.push(JSON.stringify({ node: state.node, stamps: state.stamps, path: state.path, steps: state.steps }))
  const before = state.stamps
  const spend = choice.spend || 0
  state.stamps -= spend
  state.steps = state.steps.concat([{
    type: "choice",
    from: state.node,
    text: choice.text,
    to: choice.to,
    spend,
    stampsBefore: before,
    stampsAfter: state.stamps
  }])
  state.node = choice.to
  state.path = state.path.concat([choice.to])
  render()
}

document.getElementById("back").addEventListener("click", () => {
  if (!history.length) return
  const previous = JSON.parse(history.pop())
  state.steps = state.steps.concat([{
    type: "back",
    from: state.node,
    to: previous.node,
    stampsBefore: state.stamps,
    stampsAfter: previous.stamps
  }])
  state.node = previous.node
  state.stamps = previous.stamps
  state.path = previous.path.slice()
  render()
})

document.getElementById("reset").addEventListener("click", () => {
  history.length = 0
  state = fresh()
  render()
})

document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(logSnapshot(), null, 2) + "\n"], { type: "application/json" })
  const link = document.createElement("a")
  link.href = URL.createObjectURL(blob)
  link.download = "reading-log.json"
  link.click()
  URL.revokeObjectURL(link.href)
})

render()
</script>
</body>
</html>
