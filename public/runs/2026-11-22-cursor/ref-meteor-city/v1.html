<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meteor</title>
<style>
  html, body { margin: 0; background: #101820; }
  canvas { width: 100%; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
const scene = new THREE.Scene();
const sky = new THREE.Color(0x8fb4d4);
scene.background = sky;
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const sun = new THREE.DirectionalLight(0xfff0d8, 0.9);
sun.position.set(20, 30, 10);
scene.add(sun);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 300);
camera.position.set(28, 22, 36);
camera.lookAt(0, 4, 0);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshLambertMaterial({ color: 0x6d8f62 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const buildings = [];
for (let x = -4; x <= 4; x++) {
  for (let z = -4; z <= 3; z++) {
    const h = 3 + Math.abs((x * 5 + z * 3) % 7);
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(2.2, h, 2.2), new THREE.MeshLambertMaterial({ color: (x + z) % 2 ? 0x5c6b78 : 0x3e4c59 }));
    mesh.position.set(x * 4, h / 2, z * 4);
    scene.add(mesh);
    buildings.push({ mesh, h, x: x * 4, z: z * 4, hit: false });
  }
}
const meteor = new THREE.Mesh(new THREE.SphereGeometry(1.3, 16, 12), new THREE.MeshLambertMaterial({ color: 0xc4552a }));
scene.add(meteor);
const glow = new THREE.PointLight(0xff6a2a, 0, 40);
scene.add(glow);
const started = performance.now();
let impacted = false;
function sample(t) {
  const start = new THREE.Vector3(18, 28, -8);
  const end = new THREE.Vector3(0, 3, 0);
  if (t < 3.2) {
    const k = t / 3.2;
    meteor.position.lerpVectors(start, end, k);
    glow.intensity = 0.2;
    return;
  }
  meteor.position.copy(end);
  if (!impacted) {
    impacted = true;
    buildings.forEach((building) => {
      const d = Math.hypot(building.x, building.z);
      if (d < 8) {
        building.hit = true;
        building.mesh.scale.y = 0.25;
        building.mesh.position.y = building.h * 0.125;
        building.mesh.material.color.set(0x2a241f);
      }
    });
    sky.set(0x6a4638);
    scene.background = sky;
    scene.fog = new THREE.Fog(0x6a4638, 20, 90);
  }
  glow.position.copy(end);
  glow.intensity = 2.4;
}
function resize() {
  const w = canvas.clientWidth || innerWidth;
  const h = canvas.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();
function frame(now) {
  const t = (now - started) / 1000;
  sample(t);
  const hitCount = buildings.filter((building) => building.hit).length;
  window.__meteor = {
    t,
    meteor: meteor.position.toArray(),
    impacted,
    hitCount,
    sky: "#" + sky.getHexString(),
    buildings: buildings.length
  };
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
