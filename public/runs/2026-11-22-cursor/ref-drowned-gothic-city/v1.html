<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drowned gothic city</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() {
  gl_Position = vec4(aPos, 0.0, 1.0);
}
</script>
<script id="fs" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uCam;
float hash(vec2 p) {
  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
}
float waves(vec2 p, float t) {
  float w = sin(p.x * 0.16 + t * 1.15) * 0.9;
  w += sin(p.y * 0.12 - t * 0.85) * 1.15;
  w += sin((p.x + p.y) * 0.07 + t * 0.4) * 0.55;
  return w;
}
float towerD(vec3 p) {
  float gap = 7.5;
  vec2 id = floor(p.xz / gap);
  if (id.x == 0.0) return 30.0;
  float n = hash(id);
  if (n < 0.2) return 30.0;
  vec2 local = p.xz - id * gap - 0.5 * gap;
  float h = mix(2.8, 15.0, n);
  float shaft = max(max(abs(local.x), abs(local.y)) - 0.55, max(-p.y - 2.0, p.y - h * 0.74));
  float k = clamp((p.y - h * 0.58) / (h * 0.55 + 1.6), 0.0, 1.0);
  float spire = max(length(local) - mix(1.05, 0.0, k), max(h * 0.58 - p.y, p.y - (h + 2.1)));
  vec2 q = abs(local) - vec2(0.85);
  float pinTop = h * 0.92;
  float pin = max(length(q) - mix(0.28, 0.0, clamp(p.y / pinTop, 0.0, 1.0)), p.y - pinTop);
  pin = max(pin, -p.y);
  return min(shaft, min(spire, pin));
}
void main() {
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
  float yaw = uCam.x;
  float pitch = -0.16 + uCam.y;
  vec3 ro = vec3(1.6, 6.2, uTime * 3.2);
  vec3 f = normalize(vec3(sin(yaw), pitch, cos(yaw)));
  vec3 r = normalize(vec3(cos(yaw), 0.0, -sin(yaw)));
  vec3 u = cross(r, f);
  if (u.y < 0.0) u = -u;
  vec3 rd = normalize(f + uv.x * r + uv.y * u);
  vec3 sky = mix(vec3(0.62, 0.64, 0.66), vec3(0.16, 0.18, 0.22), clamp(rd.y * 0.8 + 0.35, 0.0, 1.0));
  float t = 0.0;
  vec3 col = sky;
  for (int i = 0; i < 80; i++) {
    vec3 p = ro + rd * t;
    float water = p.y - waves(p.xz, uTime);
    float towers = towerD(p);
    float d = min(water, towers);
    if (d < 0.045) {
      if (water < towers) {
        float h0 = waves(p.xz, uTime);
        float hx = waves(p.xz + vec2(0.2, 0.0), uTime) - h0;
        float hz = waves(p.xz + vec2(0.0, 0.2), uTime) - h0;
        vec3 nrm = normalize(vec3(-hx, 0.22, -hz));
        float fres = pow(1.0 - max(dot(nrm, -rd), 0.0), 3.0);
        vec3 waterCol = mix(vec3(0.04, 0.11, 0.15), vec3(0.78, 0.84, 0.82), fres);
        float foam = smoothstep(0.45, 1.05, length(vec2(hx, hz)));
        col = mix(waterCol, vec3(0.86, 0.89, 0.88), foam);
      } else {
        float win = step(0.78, fract(p.y * 1.5)) * step(0.62, fract(p.x * 1.7 + p.z * 0.4));
        vec3 stone = mix(vec3(0.14, 0.13, 0.15), vec3(0.55, 0.36, 0.18), win);
        float light = 0.28 + 0.72 * clamp(p.y / 14.0, 0.0, 1.0);
        col = stone * light;
      }
      float fog = 1.0 - exp(-t * 0.018);
      col = mix(col, vec3(0.55, 0.58, 0.62), fog);
      break;
    }
    t += max(d, 0.04);
    if (t > 90.0) break;
  }
  gl_FragColor = vec4(col, 1.0);
}
</script>
<script>
const canvas = document.getElementById("c");
const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
const info = { ok: false, error: "", camx: 0, camy: 0, time: 0 };
window.__shader = info;
if (!gl) {
  info.error = "no webgl";
} else {
  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      info.error += gl.getShaderInfoLog(shader) + "\n";
    }
    return shader;
  }
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, document.getElementById("vs").textContent));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) info.error += gl.getProgramInfoLog(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(program, "aPos");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uRes = gl.getUniformLocation(program, "uRes");
  const uTime = gl.getUniformLocation(program, "uTime");
  const uCam = gl.getUniformLocation(program, "uCam");
  let dragging = false;
  let last = [0, 0];
  canvas.addEventListener("pointerdown", (event) => {
    dragging = true;
    last = [event.clientX, event.clientY];
  });
  window.addEventListener("pointerup", () => { dragging = false; });
  window.addEventListener("pointermove", (event) => {
    if (!dragging) return;
    info.camx += (event.clientX - last[0]) * 0.005;
    info.camy = Math.max(-0.35, Math.min(0.45, info.camy + (last[1] - event.clientY) * 0.003));
    last = [event.clientX, event.clientY];
  });
  const started = performance.now();
  function resize() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(2, Math.floor(innerWidth * dpr));
    canvas.height = Math.max(2, Math.floor(innerHeight * dpr));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  window.addEventListener("resize", resize);
  resize();
  function frame(now) {
    info.time = (now - started) / 1000;
    gl.useProgram(program);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    gl.uniform1f(uTime, info.time);
    gl.uniform2f(uCam, info.camx, info.camy);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  info.ok = info.error === "";
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
