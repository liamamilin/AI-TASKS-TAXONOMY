<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>丢了逗号的迷你校对室</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f6f1e7; color: #1c1915; font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif; }
  main { width: min(52rem, calc(100% - 1.5rem)); margin: 0 auto; padding: 1rem 0 2rem; }
  h1 { font-size: 1.6rem; }
  .quiet { color: #5e564c; }
  .grid, .views { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
  textarea, button, pre { font: inherit; }
  textarea, pre { width: 100%; background: #fffdf8; border: 1px solid #d9cbb6; padding: 0.6rem; white-space: pre-wrap; }
  textarea { min-height: 8rem; }
  button { background: #1c1915; color: #fffdf8; border: 0; padding: 0.45rem 0.7rem; margin: 0.4rem 0.4rem 0.4rem 0; }
  .delete { background: #f3d7c8; }
  .insert { background: #d7ead7; }
  .mark { font-weight: 700; }
  @media (max-width: 700px) { .grid, .views { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <p class="quiet">问笺馆原创。受公开方法资料启发，不是那些网站的官方题目，也不代表对方背书。</p>
  <h1>丢了逗号的迷你校对室</h1>
  <p>按 Unicode 字符比较。替换算一次删除再加一次插入。空格、换行和标点都保留。文字只显示，不当成网页。</p>
  <div class="grid">
    <label>原文<textarea id="old"></textarea></label>
    <label>改文<textarea id="new"></textarea></label>
  </div>
  <p>
    <button type="button" id="run">重新比较</button>
    <button type="button" id="swap">互换两边</button>
    <button type="button" id="copy">复制纯文本</button>
    <button type="button" id="download">下载 diff.json</button>
  </p>
  <p id="cost"></p>
  <div class="views">
    <section>
      <h2>原文侧</h2>
      <div id="old-view"></div>
    </section>
    <section>
      <h2>改文侧</h2>
      <div id="new-view"></div>
    </section>
  </div>
  <h2>纯文本</h2>
  <pre id="plain"></pre>
</main>
<script>
const DEFAULT_OLD = "星港📮开门了\n周六 10:00见。\n请带纸船。"
const DEFAULT_NEW = "星港📮开门啦\n周日 10:30见。\n请带纸船！"

function diffChars(oldText, newText) {
  const a = Array.from(oldText)
  const b = Array.from(newText)
  const rows = a.length + 1
  const cols = b.length + 1
  const dp = Array.from({ length: rows }, () => new Uint16Array(cols))
  for (let i = 0; i < rows; i += 1) dp[i][0] = i
  for (let j = 0; j < cols; j += 1) dp[0][j] = j
  for (let i = 1; i < rows; i += 1) {
    for (let j = 1; j < cols; j += 1) {
      if (a[i - 1] === b[j - 1]) dp[i][j] = dp[i - 1][j - 1]
      else dp[i][j] = Math.min(dp[i - 1][j], dp[i][j - 1]) + 1
    }
  }
  const pieces = []
  let i = a.length
  let j = b.length
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && a[i - 1] === b[j - 1] && dp[i][j] === dp[i - 1][j - 1]) {
      pieces.push({ op: "equal", text: a[i - 1] })
      i -= 1
      j -= 1
    } else if (i > 0 && dp[i][j] === dp[i - 1][j] + 1) {
      pieces.push({ op: "delete", text: a[i - 1] })
      i -= 1
    } else if (j > 0 && dp[i][j] === dp[i][j - 1] + 1) {
      pieces.push({ op: "insert", text: b[j - 1] })
      j -= 1
    } else {
      throw new Error("回溯失败")
    }
  }
  pieces.reverse()
  const segments = []
  for (const piece of pieces) {
    const last = segments.at(-1)
    if (last && last.op === piece.op) last.text += piece.text
    else segments.push({ op: piece.op, text: piece.text })
  }
  return { old: oldText, new: newText, cost: dp[a.length][b.length], segments }
}

function plainOf(result) {
  return result.segments.map((segment) => {
    const mark = segment.op === "delete" ? "- " : segment.op === "insert" ? "+ " : "= "
    return mark + segment.text
  }).join("\n")
}

function fillColumn(id, result, side) {
  const box = document.getElementById(id)
  box.textContent = ""
  for (const segment of result.segments) {
    if (side === "old" && segment.op === "insert") continue
    if (side === "new" && segment.op === "delete") continue
    const span = document.createElement("span")
    span.className = segment.op
    span.dataset.op = segment.op
    if (segment.op === "delete" || segment.op === "insert") {
      const mark = document.createElement("span")
      mark.className = "mark"
      mark.textContent = segment.op === "delete" ? "〔删除〕" : "〔插入〕"
      span.append(mark)
    }
    span.append(document.createTextNode(segment.text))
    box.append(span)
  }
}

let current = null

function render() {
  const oldText = document.getElementById("old").value
  const newText = document.getElementById("new").value
  current = diffChars(oldText, newText)
  window.__diff = current
  document.getElementById("cost").textContent = `总代价 ${current.cost}`
  fillColumn("old-view", current, "old")
  fillColumn("new-view", current, "new")
  document.getElementById("plain").textContent = plainOf(current)
}

document.getElementById("run").addEventListener("click", render)
document.getElementById("swap").addEventListener("click", () => {
  const oldBox = document.getElementById("old")
  const newBox = document.getElementById("new")
  const hold = oldBox.value
  oldBox.value = newBox.value
  newBox.value = hold
  render()
})
document.getElementById("copy").addEventListener("click", async () => {
  const text = document.getElementById("plain").textContent
  try {
    await navigator.clipboard.writeText(text)
  } catch (error) {
    document.getElementById("cost").textContent = `总代价 ${current.cost}。剪贴板不可用，纯文本仍在下面。`
  }
})
document.getElementById("download").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(current, null, 2) + "\n"], { type: "application/json" })
  const link = document.createElement("a")
  link.href = URL.createObjectURL(blob)
  link.download = "diff.json"
  link.click()
  URL.revokeObjectURL(link.href)
})

document.getElementById("old").value = DEFAULT_OLD
document.getElementById("new").value = DEFAULT_NEW
render()
</script>
</body>
</html>
