<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesseract</title>
<style>
  html, body { margin: 0; background: #0e1218; }
  canvas { width: min(100vw, 1100px); height: auto; display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1100" height="700"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const verts = [];
for (let i = 0; i < 16; i++) verts.push({ x: (i & 1) ? 1 : -1, y: (i & 2) ? 1 : -1, z: (i & 4) ? 1 : -1, w: (i & 8) ? 1 : -1 });
const edges = [];
for (let i = 0; i < 16; i++) {
  for (let j = i + 1; j < 16; j++) {
    const a = verts[i], b = verts[j];
    const diff = (a.x !== b.x) + (a.y !== b.y) + (a.z !== b.z) + (a.w !== b.w);
    if (diff === 1) edges.push([i, j]);
  }
}
let angleXW = 0.4;
let angleYZ = 0.2;
const ball = { x: 0.2, y: 0.35, z: -0.15, w: 0.1, vx: 0.72, vy: 0.48, vz: -0.36, vw: 0.55 };
const radius = 0.12;
const hits = [];
let minBound = 1;
function rot4(p) {
  const cx = Math.cos(angleXW), sx = Math.sin(angleXW);
  const cy = Math.cos(angleYZ), sy = Math.sin(angleYZ);
  const x = p.x * cx - p.w * sx;
  const w = p.x * sx + p.w * cx;
  const y = p.y * cy - p.z * sy;
  const z = p.y * sy + p.z * cy;
  return { x, y, z, w };
}
function project(p) {
  const q = rot4(p);
  const k = 3.1 / (3.1 - q.w);
  const f = 210 / (3.4 - q.z * 0.35);
  return { x: canvas.width / 2 + q.x * k * f, y: canvas.height / 2 - q.y * k * f, k, z: q.z };
}
function step(dt) {
  angleXW += dt * 0.55;
  angleYZ += dt * 0.37;
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  ball.z += ball.vz * dt;
  ball.w += ball.vw * dt;
  const coords = ["x", "y", "z", "w"];
  const vels = ["vx", "vy", "vz", "vw"];
  for (let i = 0; i < 4; i++) {
    const limit = 1 - radius;
    const value = ball[coords[i]];
    minBound = Math.min(minBound, limit - Math.abs(value));
    if (value > limit && ball[vels[i]] > 0) {
      ball[coords[i]] = limit;
      ball[vels[i]] *= -1;
      if (hits.length < 40) hits.push(coords[i]);
    } else if (value < -limit && ball[vels[i]] < 0) {
      ball[coords[i]] = -limit;
      ball[vels[i]] *= -1;
      if (hits.length < 40) hits.push(coords[i]);
    }
  }
}
let last = performance.now();
let spread0 = 0;
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  step(dt);
  const pts = verts.map(project);
  const ks = pts.map((p) => p.k);
  const spread = Math.max(...ks) / Math.min(...ks);
  if (!spread0) spread0 = spread;
  ctx.fillStyle = "#0e1218";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.lineWidth = 1.6;
  for (const [i, j] of edges) {
    const a = pts[i], b = pts[j];
    const dw = Math.abs(verts[i].w - verts[j].w);
    ctx.strokeStyle = dw ? "rgba(232,196,122,0.95)" : "rgba(126,196,214,0.9)";
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();
  }
  const bp = project(ball);
  ctx.fillStyle = "#e25b45";
  ctx.beginPath();
  ctx.arc(bp.x, bp.y, 11, 0, Math.PI * 2);
  ctx.fill();
  window.__tess.spread = spread;
  window.__tess.spread0 = spread0;
  requestAnimationFrame(frame);
}
window.__tess = {
  vertices: verts.length,
  edges: edges.length,
  angle: () => angleXW,
  ball: () => ({ x: ball.x, y: ball.y, z: ball.z, w: ball.w, vx: ball.vx, vy: ball.vy, vz: ball.vz, vw: ball.vw }),
  hits: () => hits.slice(),
  inside: () => Math.abs(ball.x) <= 1 && Math.abs(ball.y) <= 1 && Math.abs(ball.z) <= 1 && Math.abs(ball.w) <= 1,
  minBound: () => minBound,
  spread: 0,
  spread0: 0
};
requestAnimationFrame(frame);
</script>
</body>
</html>
