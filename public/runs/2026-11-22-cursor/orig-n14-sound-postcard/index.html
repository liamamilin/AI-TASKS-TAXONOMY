<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>纸城声音明信片</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f6f1e7; color: #1c1915; font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif; }
  main { width: min(40rem, calc(100% - 1.5rem)); margin: 0 auto; padding: 1rem 0 2rem; }
  h1 { font-size: 1.6rem; }
  .quiet { color: #5e564c; }
  button { font: inherit; background: #1c1915; color: #fffdf8; border: 0; padding: 0.5rem 0.75rem; }
  ol { padding-left: 1.2rem; }
  .lane { display: grid; grid-template-columns: 4.5rem 1fr; gap: 0.4rem; align-items: center; margin: 0.35rem 0; }
  .bar { position: relative; height: 1.4rem; background: #efe2c9; }
  .mark { position: absolute; top: 0; bottom: 0; background: #8c5434; }
  audio { width: 100%; margin-top: 0.8rem; }
</style>
</head>
<body>
<main>
  <p class="quiet">问笺馆原创。受公开方法资料启发，不是那些网站的官方题目，也不代表对方背书。像不像门铃是主观听感，不计入客观通过。</p>
  <h1>纸城声音明信片</h1>
  <p>八秒合成波形：门铃、脚步、拆信。页面不会自己响，也不要麦克风。</p>
  <button type="button" id="play">播放</button>
  <audio id="audio" src="postcard.wav" preload="none"></audio>
  <h2>三段都写在这里</h2>
  <ol>
    <li id="bell">0.5–1.3 秒：两声轻门铃。</li>
    <li id="steps">2.0–4.0 秒：四步脚步，起点 2.0、2.5、3.0、3.5 秒，每步 0.2 秒。</li>
    <li id="paper">5.0–7.0 秒：拆开纸信的沙沙声。</li>
  </ol>
  <div class="lane"><span>门铃</span><div class="bar"><i class="mark" style="left:6.25%;width:10%"></i></div></div>
  <div class="lane"><span>脚步</span><div class="bar"><i class="mark" style="left:25%;width:25%"></i></div></div>
  <div class="lane"><span>拆信</span><div class="bar"><i class="mark" style="left:62.5%;width:25%"></i></div></div>
  <p class="quiet">其余时间是留白。波形由 synth.py 用正弦和噪声合成，种子 42。</p>
</main>
<script>
const audio = document.getElementById("audio")
document.getElementById("play").addEventListener("click", () => {
  audio.play()
})
</script>
</body>
</html>
