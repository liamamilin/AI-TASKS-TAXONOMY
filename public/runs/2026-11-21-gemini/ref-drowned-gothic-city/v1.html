<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drowned Neo-Gothic City Shader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, canvas { width: 100%; height: 100%; display: block; overflow: hidden; background: #070b12; cursor: grab; }
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");

    let yaw = 0.0, pitch = 0.08, drag = false, lx = 0, ly = 0;
    canvas.addEventListener("pointerdown", (e) => { drag = true; lx = e.clientX; ly = e.clientY; });
    window.addEventListener("pointerup", () => { drag = false; });
    window.addEventListener("pointermove", (e) => {
      if (!drag) return;
      yaw += (e.clientX - lx) * 0.005;
      pitch = Math.max(-0.22, Math.min(0.35, pitch + (e.clientY - ly) * 0.004));
      lx = e.clientX; ly = e.clientY;
    });

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 1.5);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener("resize", resize);
    resize();

    if (gl) {
      const vs = `attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }`;
      const fs = `
        precision highp float;
        uniform vec2 r;
        uniform float t;
        uniform vec2 cam;

        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p){
          vec2 i = floor(p), f = fract(p);
          f = f*f*(3.-2.*f);
          return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
        }
        float waveH(vec2 p){
          float h = sin(p.x*0.65 + t*1.7)*0.24 + cos(p.y*0.55 - t*1.3)*0.22;
          h += (noise(p*0.9 + vec2(t*0.6, -t*0.4)) - 0.5) * 0.42;
          h += (noise(p*2.4 - vec2(t*0.9, t*0.5)) - 0.5) * 0.14;
          return h;
        }
        float sdTower(vec3 p){
          vec2 id = floor(p.xz / 4.2);
          float hSeed = hash(id);
          vec2 q = mod(p.xz, 4.2) - 2.1;
          float towerH = 2.6 + hSeed * 6.5;
          // Neo-gothic stepped spire + pointed buttresses
          float base = max(abs(q.x), abs(q.y)) - (0.72 - p.y * 0.055);
          float spire = length(q) - max(0.02, (towerH - p.y) * 0.16);
          float d = max(base, p.y - towerH);
          d = min(d, max(spire, p.y - (towerH + 2.4)));
          // Gothic lancet arch cutouts
          float arch = length(vec2(abs(q.x)-0.22, mod(p.y, 1.3)-0.65)) - 0.14;
          d = max(d, -arch);
          return d;
        }
        vec2 map(vec3 p){
          float water = p.y - waveH(p.xz);
          float city = sdTower(p);
          return water < city ? vec2(water, 1.0) : vec2(city, 2.0);
        }
        vec3 calcNorm(vec3 p){
          vec2 e = vec2(0.015, 0.0);
          return normalize(vec3(
            map(p+e.xyy).x - map(p-e.xyy).x,
            map(p+e.yxy).x - map(p-e.yxy).x,
            map(p+e.yyx).x - map(p-e.yyx).x
          ));
        }
        void main(){
          vec2 uv = (gl_FragCoord.xy - 0.5*r) / r.y;
          vec3 ro = vec3(t * 0.8, 2.35, t * 1.4);
          vec3 rd = normalize(vec3(uv, 1.25));
          float cy = cos(cam.x), sy = sin(cam.x);
          float cp = cos(cam.y), sp = sin(cam.y);
          rd.yz = mat2(cp, -sp, sp, cp) * rd.yz;
          rd.xz = mat2(cy, -sy, sy, cy) * rd.xz;

          float d = 0.0, mat = 0.0;
          for(int i=0; i<72; i++){
            vec3 p = ro + rd * d;
            vec2 h = map(p);
            if(h.x < 0.015 || d > 58.0){ mat = h.y; break; }
            d += h.x * 0.72;
          }

          float lightning = smoothstep(0.96, 1.0, sin(t * 1.3) * sin(t * 7.1));
          vec3 sky = mix(vec3(0.05, 0.08, 0.13), vec3(0.16, 0.22, 0.30), clamp(uv.y + 0.35, 0.0, 1.0));
          sky += vec3(0.32, 0.42, 0.58) * lightning;
          // Moon halo
          vec3 moonDir = normalize(vec3(-0.35, 0.28, 0.9));
          sky += vec3(0.7, 0.8, 0.95) * pow(max(dot(rd, moonDir), 0.0), 48.0);

          vec3 col = sky;
          if(d < 58.0){
            vec3 p = ro + rd * d;
            vec3 n = calcNorm(p);
            float diff = max(dot(n, moonDir), 0.0);
            float fres = pow(1.0 - max(dot(n, -rd), 0.0), 4.0);
            if(mat < 1.5){
              // Stormy ocean
              vec3 refl = reflect(rd, n);
              float spec = pow(max(dot(refl, moonDir), 0.0), 36.0);
              col = vec3(0.02, 0.06, 0.10) + vec3(0.18, 0.28, 0.36) * fres + vec3(0.8, 0.9, 1.0) * spec;
            } else {
              // Wet dark gothic stone + warm candlelit windows
              float win = step(0.84, hash(floor(p.xz * 2.0) + floor(p.y * 1.4)));
              col = vec3(0.08, 0.09, 0.11) * (0.35 + diff * 0.9 + lightning * 0.8);
              col += vec3(0.95, 0.62, 0.26) * win * smoothstep(0.6, 2.8, p.y) * 0.55;
            }
            float fog = 1.0 - exp(-d * 0.042);
            col = mix(col, sky, fog);
          }
          gl_FragColor = vec4(pow(col, vec3(0.88)), 1.0);
        }
      `;
      const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog); gl.useProgram(prog);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "p");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const uR = gl.getUniformLocation(prog, "r");
      const uT = gl.getUniformLocation(prog, "t");
      const uCam = gl.getUniformLocation(prog, "cam");

      function render(now) {
        gl.uniform2f(uR, canvas.width, canvas.height);
        gl.uniform1f(uT, now * 0.001);
        gl.uniform2f(uCam, yaw, pitch);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    }
  </script>
</body>
</html>
