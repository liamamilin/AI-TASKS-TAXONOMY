<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ball Bouncing Inside a Rotating Tesseract</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070a12; color: #e8eef8; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: fixed; left: 16px; top: 14px; display: flex; gap: 12px; align-items: center;
      background: rgba(14, 19, 32, 0.8); border: 1px solid rgba(140, 178, 255, 0.22);
      border-radius: 999px; padding: 7px 14px; font-size: 13px;
    }
    .hud input[type="range"] { width: 84px; accent-color: #6ce5ff; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hud">
    <span>4D Tesseract</span>
    <label>4D Spin <input id="spin" type="range" min="0" max="2.2" step="0.1" value="0.9"></label>
  </div>
  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const spinInput = document.getElementById("spin");

    let W = innerWidth, H = innerHeight;
    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    // 16 vertices of a 4D hypercube [-1, 1]^4
    const verts4D = [];
    for (let i = 0; i < 16; i++) {
      verts4D.push([
        (i & 1) ? 1 : -1,
        (i & 2) ? 1 : -1,
        (i & 4) ? 1 : -1,
        (i & 8) ? 1 : -1,
      ]);
    }
    // 32 edges connecting vertices differing by 1 bit
    const edges = [];
    for (let i = 0; i < 16; i++) {
      for (let b = 0; b < 4; b++) {
        const j = i ^ (1 << b);
        if (i < j) edges.push([i, j, b]);
      }
    }

    // Ball bouncing in local 4D hypercube coordinates [-0.88, 0.88]^4
    const ball = { p: [0.2, 0.3, -0.1, 0.15], v: [1.35, 1.05, 0.92, 0.78] };
    const trail = [];

    function rot4(v, axw, ayz, axz, ayw) {
      let [x, y, z, w] = v;
      let c = Math.cos(axw), s = Math.sin(axw);
      [x, w] = [x * c - w * s, x * s + w * c];
      c = Math.cos(ayz); s = Math.sin(ayz);
      [y, z] = [y * c - z * s, y * s + z * c];
      c = Math.cos(axz); s = Math.sin(axz);
      [x, z] = [x * c - z * s, x * s + z * c];
      c = Math.cos(ayw); s = Math.sin(ayw);
      [y, w] = [y * c - w * s, y * s + w * c];
      return [x, y, z, w];
    }

    function project(v4) {
      const wDist = 3.1;
      const wScale = 1 / (wDist - v4[3]);
      const x3 = v4[0] * wScale;
      const y3 = v4[1] * wScale;
      const z3 = v4[2] * wScale;
      const zDist = 2.6;
      const zScale = Math.min(W, H) * 0.62 / (zDist - z3);
      return { x: W / 2 + x3 * zScale, y: H / 2 + y3 * zScale, depth: z3 + v4[3] * 0.5, scale: zScale * wScale };
    }

    let t = 0, last = performance.now();
    function loop(now) {
      const dt = Math.min(0.04, (now - last) / 1000);
      last = now;
      const sp = Number(spinInput.value);
      t += dt * sp;

      const limit = 0.86;
      for (let k = 0; k < 4; k++) {
        ball.p[k] += ball.v[k] * dt;
        if (ball.p[k] > limit) { ball.p[k] = limit; ball.v[k] *= -1; }
        if (ball.p[k] < -limit) { ball.p[k] = -limit; ball.v[k] *= -1; }
      }

      const axw = t * 0.85, ayz = t * 0.6, axz = t * 0.45, ayw = t * 0.35;
      const projVerts = verts4D.map((v) => project(rot4(v, axw, ayz, axz, ayw)));
      const bp = project(rot4(ball.p, axw, ayz, axz, ayw));
      trail.push({ x: bp.x, y: bp.y });
      if (trail.length > 42) trail.shift();

      ctx.fillStyle = "#070a12";
      ctx.fillRect(0, 0, W, H);

      for (const [i, j, axis] of edges) {
        const a = projVerts[i], b = projVerts[j];
        const isW = axis === 3;
        ctx.strokeStyle = isW ? "rgba(186, 122, 255, 0.72)" : "rgba(92, 210, 255, 0.78)";
        ctx.lineWidth = isW ? 1.8 : 2.2;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
      for (const p of projVerts) {
        ctx.fillStyle = "#d9f4ff";
        ctx.beginPath(); ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2); ctx.fill();
      }

      for (let i = 1; i < trail.length; i++) {
        const ratio = i / trail.length;
        ctx.strokeStyle = `rgba(255, 118, 84, ${(ratio * 0.75).toFixed(2)})`;
        ctx.lineWidth = ratio * 5;
        ctx.beginPath(); ctx.moveTo(trail[i-1].x, trail[i-1].y); ctx.lineTo(trail[i].x, trail[i].y); ctx.stroke();
      }

      const br = Math.max(7, Math.min(18, bp.scale * 0.085));
      const g = ctx.createRadialGradient(bp.x - 3, bp.y - 3, 1, bp.x, bp.y, br * 1.8);
      g.addColorStop(0, "#fff2c6");
      g.addColorStop(0.45, "#ff7654");
      g.addColorStop(1, "rgba(255, 80, 50, 0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bp.x, bp.y, br * 1.8, 0, Math.PI * 2); ctx.fill();

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
