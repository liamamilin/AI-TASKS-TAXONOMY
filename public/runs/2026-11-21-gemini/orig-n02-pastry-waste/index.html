<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>点心摊别再做多了</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f3ecdf; color: #1d1916; font-family: system-ui, -apple-system, sans-serif; padding: 20px; line-height: 1.55; }
    .wrap { max-width: 880px; margin: 0 auto; display: grid; gap: 16px; }
    .card { background: #fffaf2; border: 1px solid #dfd3bf; border-radius: 12px; padding: 16px 18px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    h1 { font-size: 22px; }
    h2 { font-size: 15px; color: #5e554a; margin-bottom: 10px; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; }
    button { border-radius: 999px; padding: 6px 14px; border: 1px solid #cbbba2; background: #f5ede0; color: #1d1916; cursor: pointer; font: 600 13px inherit; }
    button.on { background: #1d1916; color: #fffaf2; border-color: #1d1916; }
    .summary { font-size: 14px; color: #3a332b; margin-top: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e7dccb; }
    th { background: #f5ede0; color: #5e554a; }
    .chart-row { display: grid; grid-template-columns: 84px 1fr 110px; align-items: center; gap: 10px; margin: 10px 0; font-size: 13px; }
    .track { height: 22px; background: #efe6d6; border-radius: 6px; overflow: hidden; }
    .fill { height: 100%; background: #9c3b32; border-radius: 6px; }
    .unknown { color: #8c6a3b; font-style: italic; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <header>
        <h1>点心摊剩余看板（合成数据）</h1>
        <div class="bar" id="filters"></div>
      </header>
      <p class="summary" id="summary-text"></p>
      <div class="bar" style="margin-top:10px;">
        <button type="button" id="dl">下载当前 summary.json</button>
      </div>
    </section>
    <section class="card">
      <h2>横向剩余量条形图（零基线，单位：个）</h2>
      <div id="chart"></div>
    </section>
    <section class="card">
      <h2>品类汇总表（所有比率均注明分母，缺测行不计入可计算分母）</h2>
      <div id="agg-table"></div>
    </section>
    <section class="card">
      <h2>原始明细</h2>
      <div id="raw-table"></div>
    </section>
  </main>
  <script>
    const ROWS = [
      { day: "2026-04-01", item: "月牙饼", made: 20, sold: 15 },
      { day: "2026-04-01", item: "星星酥", made: 10, sold: 10 },
      { day: "2026-04-02", item: "月牙饼", made: 12, sold: null },
      { day: "2026-04-02", item: "星星酥", made: 16, sold: 12 },
    ];
    let curDay = "all";
    let curSummary = null;

    function compute(day) {
      const rows = day === "all" ? ROWS : ROWS.filter((r) => r.day === day);
      const items = [...new Set(ROWS.map((r) => r.item))];
      const byItem = items.map((name) => {
        const sub = rows.filter((r) => r.item === name);
        let totalMade = 0, knownMade = 0, knownSold = 0, missingRows = 0;
        for (const r of sub) {
          totalMade += r.made;
          if (r.sold === null) missingRows += 1;
          else { knownMade += r.made; knownSold += r.sold; }
        }
        const computableLeft = knownMade > 0 ? knownMade - knownSold : null;
        const rate = knownMade > 0 ? +(computableLeft / knownMade * 100).toFixed(2) : null;
        return {
          item: name, totalMade, knownSold: knownMade > 0 ? knownSold : null,
          computableDenominator: knownMade, computableLeft,
          leftoverRatePercent: rate,
          rateLabel: knownMade > 0 ? `${rate}%（${computableLeft}/${knownMade}）` : "未知（无已知售出行）",
          missingRows,
        };
      });
      const totalComputableLeft = byItem.reduce((s, x) => s + (x.computableLeft || 0), 0);
      const totalMissingRows = byItem.reduce((s, x) => s + x.missingRows, 0);
      return { filterDay: day, totalComputableLeft, totalMissingRows, byItem, rows };
    }

    function render() {
      const days = ["all", "2026-04-01", "2026-04-02"];
      document.getElementById("filters").innerHTML = days.map((d) =>
        `<button type="button" class="${curDay === d ? "on" : ""}" data-day="${d}">${d === "all" ? "全部日期" : d}</button>`
      ).join("");

      curSummary = compute(curDay);
      document.getElementById("summary-text").textContent =
        `筛选：${curDay === "all" ? "全部日期" : curDay} · 总可计算剩余 ${curSummary.totalComputableLeft} 个 · 缺测 ${curSummary.totalMissingRows} 行（sold=null 不假设卖出 0，不计入可计算剩余与分母）。`;

      const maxVal = Math.max(1, ...curSummary.byItem.map((x) => x.computableLeft || 0));
      document.getElementById("chart").innerHTML = curSummary.byItem.map((x) => {
        if (x.computableLeft === null) {
          return `<div class="chart-row"><strong>${x.item}</strong><div class="track"></div><span class="unknown">未知（缺测）</span></div>`;
        }
        const pct = (x.computableLeft / maxVal) * 100;
        return `<div class="chart-row"><strong>${x.item}</strong><div class="track"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div><span>${x.computableLeft} 个（${x.rateLabel}）</span></div>`;
      }).join("");

      document.getElementById("agg-table").innerHTML = `<table><thead><tr><th>品类</th><th>总制作</th><th>已知售出</th><th>可计算剩余</th><th>剩余率（含分母）</th><th>缺测行数</th></tr></thead><tbody>${
        curSummary.byItem.map((x) => `<tr><td>${x.item}</td><td>${x.totalMade}</td><td>${x.knownSold === null ? "未知" : x.knownSold}</td><td>${x.computableLeft === null ? "未知" : x.computableLeft}</td><td>${x.rateLabel}</td><td>${x.missingRows}</td></tr>`).join("")
      }</tbody></table>`;

      document.getElementById("raw-table").innerHTML = `<table><thead><tr><th>日期</th><th>品类</th><th>制作</th><th>售出</th></tr></thead><tbody>${
        curSummary.rows.map((r) => `<tr><td>${r.day}</td><td>${r.item}</td><td>${r.made}</td><td>${r.sold === null ? "缺测 (null)" : r.sold}</td></tr>`).join("")
      }</tbody></table>`;
    }

    document.getElementById("filters").addEventListener("click", (e) => {
      const b = e.target.closest("[data-day]");
      if (!b) return;
      curDay = b.dataset.day; render();
    });
    document.getElementById("dl").addEventListener("click", () => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(curSummary, null, 2)], { type: "application/json" }));
      a.download = "summary.json"; a.click(); URL.revokeObjectURL(a.href);
    });
    render();
  </script>
</body>
</html>
