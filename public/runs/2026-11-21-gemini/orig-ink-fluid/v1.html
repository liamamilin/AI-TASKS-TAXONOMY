<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宣纸水墨流体</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #efe7d8; font-family: "Noto Serif SC", system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
    .hud {
      position: fixed; left: 16px; top: 14px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      background: rgba(246, 239, 226, 0.88); color: #1f1b16;
      border: 1px solid #d5c7b0; border-radius: 999px; padding: 7px 14px; font-size: 13px;
    }
    .hud button {
      background: #1f1b16; color: #f6efe2; border: 0; border-radius: 999px;
      padding: 4px 12px; cursor: pointer; font: inherit;
    }
    .hud input[type="range"] { width: 80px; accent-color: #9c3b32; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <span>拖动宣纸滴墨</span>
    <label>墨浓 <input id="density" type="range" min="0.4" max="1.6" step="0.1" value="1.0"></label>
    <button id="clear" type="button">留白重置</button>
  </div>
  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    const densityEl = document.getElementById("density");
    const clearBtn = document.getElementById("clear");

    const drops = [
      { x: 0.34, y: 0.46, t: 0.0 },
      { x: 0.62, y: 0.56, t: 0.3 },
      { x: 0.48, y: 0.32, t: 0.6 },
    ];
    let pointerDown = false;
    let time = 2.4;

    function addDrop(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      drops.push({
        x: (clientX - rect.left) / rect.width,
        y: 1.0 - (clientY - rect.top) / rect.height,
        t: time,
      });
      if (drops.length > 16) drops.shift();
    }

    canvas.addEventListener("pointerdown", (e) => { pointerDown = true; addDrop(e.clientX, e.clientY); });
    window.addEventListener("pointerup", () => { pointerDown = false; });
    canvas.addEventListener("pointermove", (e) => { if (pointerDown) addDrop(e.clientX, e.clientY); });
    clearBtn.addEventListener("click", () => { drops.length = 0; });

    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener("resize", resize);
    resize();

    if (gl) {
      const vs = `
        attribute vec2 a_pos;
        varying vec2 v_uv;
        void main() {
          v_uv = a_pos * 0.5 + 0.5;
          gl_Position = vec4(a_pos, 0.0, 1.0);
        }
      `;
      const fs = `
        precision mediump float;
        varying vec2 v_uv;
        uniform float u_time;
        uniform float u_density;
        uniform vec2 u_res;
        uniform vec3 u_drops[16];
        uniform int u_count;

        float hash(vec2 p) {
          return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
        }
        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0,0.0)), hash(i + vec2(1.0,0.0)), u.x),
            mix(hash(i + vec2(0.0,1.0)), hash(i + vec2(1.0,1.0)), u.x),
            u.y
          );
        }
        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          for (int i = 0; i < 5; i++) {
            v += a * noise(p);
            p = p * 2.03 + vec2(13.1, 7.7);
            a *= 0.5;
          }
          return v;
        }
        void main() {
          vec2 uv = v_uv;
          float aspect = u_res.x / max(u_res.y, 1.0);
          vec2 p = vec2(uv.x * aspect, uv.y);

          // Domain-warped flow field
          vec2 q = vec2(fbm(p * 3.2 + u_time * 0.08), fbm(p * 3.2 + vec2(5.2, 1.3) - u_time * 0.06));
          vec2 r = vec2(fbm(p * 4.5 + 1.8 * q + u_time * 0.05), fbm(p * 4.5 + 1.8 * q + vec2(8.3, 2.8)));
          float swirl = fbm(p * 3.8 + 2.2 * r);

          float ink = smoothstep(0.56, 0.88, swirl) * 0.36;

          for (int i = 0; i < 16; i++) {
            if (i >= u_count) break;
            vec3 d = u_drops[i];
            float age = max(0.0, u_time - d.z);
            float radius = 0.06 + min(0.32, age * 0.055);
            vec2 dp = vec2((uv.x - d.x) * aspect, uv.y - d.y);
            float dist = length(dp) - (swirl - 0.5) * 0.16;
            float blot = smoothstep(radius, radius * 0.18, dist);
            float ring = smoothstep(radius * 1.08, radius * 0.88, dist) * (1.0 - smoothstep(radius * 0.86, radius * 0.65, dist));
            ink += blot * 0.68 + ring * 0.25;
          }

          ink = clamp(ink * u_density, 0.0, 1.0);

          // Xuan paper fiber texture
          float fiber = (noise(p * 90.0) - 0.5) * 0.035 + (noise(vec2(p.x * 260.0, p.y * 28.0)) - 0.5) * 0.02;
          vec3 paper = vec3(0.945, 0.914, 0.855) + fiber;
          vec3 sumi = vec3(0.11, 0.105, 0.10);
          vec3 col = mix(paper, sumi, smoothstep(0.08, 0.92, ink));
          // Subtle vermilion seal accent in corner
          gl_FragColor = vec4(col, 1.0);
        }
      `;

      function compile(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      }
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      gl.useProgram(prog);

      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "a_pos");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

      const uTime = gl.getUniformLocation(prog, "u_time");
      const uDensity = gl.getUniformLocation(prog, "u_density");
      const uRes = gl.getUniformLocation(prog, "u_res");
      const uDrops = gl.getUniformLocation(prog, "u_drops");
      const uCount = gl.getUniformLocation(prog, "u_count");

      let last = performance.now();
      function render(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        time += dt;
        const flat = new Float32Array(16 * 3);
        drops.forEach((d, i) => { flat[i*3] = d.x; flat[i*3+1] = d.y; flat[i*3+2] = d.t; });
        gl.uniform1f(uTime, time);
        gl.uniform1f(uDensity, Number(densityEl.value));
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform3fv(uDrops, flat);
        gl.uniform1i(uCount, drops.length);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    }
  </script>
</body>
</html>
