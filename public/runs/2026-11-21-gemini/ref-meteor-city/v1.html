<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meteor Impact on City</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0c1324; font-family: system-ui, sans-serif; }
    .hud {
      position: fixed; left: 14px; top: 12px; display: flex; gap: 10px; align-items: center;
      background: rgba(14, 18, 28, 0.8); color: #eef3fb; padding: 7px 14px; border-radius: 999px; font-size: 13px;
    }
    .hud button {
      background: #d94e28; color: #fff; border: 0; border-radius: 999px; padding: 4px 12px; cursor: pointer; font: 600 12px inherit;
    }
  </style>
</head>
<body>
  <div class="hud">
    <span id="phase">Incoming Meteor…</span>
    <button id="replay" type="button">Replay Impact</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const skyNorm = new THREE.Color(0x0d1629);
    const skyAfter = new THREE.Color(0x3a1814);
    scene.background = skyNorm.clone();
    scene.fog = new THREE.Fog(0x0d1629, 30, 120);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 220);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x8899bb, 0.6));
    const dir = new THREE.DirectionalLight(0xffe0b2, 0.9);
    dir.position.set(20, 30, 20);
    scene.add(dir);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(140, 140),
      new THREE.MeshLambertMaterial({ color: 0x1d222c })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // City buildings
    const buildings = [];
    for (let gx = -5; gx <= 5; gx++) {
      for (let gz = -5; gz <= 5; gz++) {
        if (Math.abs(gx) <= 0.5 && Math.abs(gz) <= 0.5) continue;
        const h = 4 + ((Math.abs(gx * 7 + gz * 13)) % 11);
        const b = new THREE.Mesh(
          new THREE.BoxGeometry(2.4, h, 2.4),
          new THREE.MeshStandardMaterial({ color: 0x334056, roughness: 0.7 })
        );
        b.position.set(gx * 3.8, h / 2, gz * 3.8);
        b.userData = { baseY: h / 2, dist: Math.hypot(gx, gz) };
        scene.add(b);
        buildings.push(b);
      }
    }

    // Meteor & fiery glow
    const meteor = new THREE.Group();
    meteor.add(new THREE.Mesh(new THREE.DodecahedronGeometry(1.7, 1), new THREE.MeshStandardMaterial({ color: 0x5c3628, emissive: 0xff5511, emissiveIntensity: 0.7 })));
    const meteorLight = new THREE.PointLight(0xff7733, 3.5, 45);
    meteor.add(meteorLight);
    scene.add(meteor);

    // Shockwave ring & fireball
    const wave = new THREE.Mesh(
      new THREE.RingGeometry(0.8, 1.8, 48),
      new THREE.MeshBasicMaterial({ color: 0xffaa44, side: THREE.DoubleSide, transparent: true, opacity: 0 })
    );
    wave.rotation.x = -Math.PI / 2;
    wave.position.y = 0.25;
    scene.add(wave);

    const fireball = new THREE.Mesh(
      new THREE.SphereGeometry(1, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0xff8833, transparent: true, opacity: 0 })
    );
    scene.add(fireball);

    const phaseEl = document.getElementById("phase");
    let t = 0;

    function reset() {
      t = 0;
      scene.background.copy(skyNorm);
      scene.fog.color.copy(skyNorm);
      meteor.visible = true;
      wave.material.opacity = 0;
      fireball.material.opacity = 0;
      for (const b of buildings) {
        b.position.y = b.userData.baseY;
        b.rotation.set(0, 0, 0);
      }
    }
    document.getElementById("replay").addEventListener("click", reset);
    reset();

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    let last = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      t += dt;
      if (t > 9.5) reset();

      const impactT = 3.2;
      let shake = 0;
      if (t < impactT) {
        const u = t / impactT;
        meteor.position.set(36 * (1 - u), 42 * (1 - u) + 1.5, -24 * (1 - u));
        meteor.rotation.x += dt * 3; meteor.rotation.y += dt * 2;
        phaseEl.textContent = "Incoming Meteor…";
      } else {
        const e = t - impactT;
        meteor.visible = false;
        shake = Math.max(0, 1.4 - e * 0.9);
        const s = 1 + e * 18;
        wave.scale.set(s, s, 1);
        wave.material.opacity = Math.max(0, 0.9 - e * 0.35);

        const fb = 1 + Math.min(12, e * 9);
        fireball.scale.set(fb, fb * 0.8, fb);
        fireball.material.opacity = Math.max(0, 0.85 - e * 0.25);

        scene.background.lerpColors(skyNorm, skyAfter, Math.min(1, e * 0.6));
        scene.fog.color.copy(scene.background);

        for (const b of buildings) {
          if (b.userData.dist < 3.5) {
            const tilt = Math.min(0.75, e * 0.55);
            b.rotation.z = (b.position.x > 0 ? -1 : 1) * tilt;
            b.position.y = Math.max(0.8, b.userData.baseY - e * 1.1);
          }
        }
        phaseEl.textContent = "Impact! City & Sky Transformed";
      }

      camera.position.set(
        28 + Math.sin(t * 0.25) * 4 + (Math.random() - 0.5) * shake,
        19 + (Math.random() - 0.5) * shake,
        32
      );
      camera.lookAt(0, 4, 0);
      renderer.render(scene, camera);
    }
    animate(performance.now());
  </script>
</body>
</html>
