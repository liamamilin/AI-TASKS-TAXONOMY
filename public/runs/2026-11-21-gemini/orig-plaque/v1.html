<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>展品 No. 014</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: #ffffff; color: #000000;
      font-family: "Noto Serif SC", "Songti SC", "STSong", Georgia, serif;
      display: grid; place-items: center;
    }
    .plaque {
      width: min(86vw, 420px);
      border: 1.5px solid #000000;
      padding: 36px 32px;
      text-align: center;
      background: #ffffff;
    }
    .no { font-size: 14px; letter-spacing: 0.14em; margin-bottom: 14px; }
    .title { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
    .hint { font-size: 16px; letter-spacing: 0.06em; }
    @media print {
      @page { margin: 15mm; }
      html, body { height: auto; min-height: 90vh; background: #ffffff; }
      .plaque { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <article class="plaque">
    <p class="no">展品 No. 014</p>
    <p class="title">门外那盏灯</p>
    <p class="hint">先加热再进门</p>
  </article>
</body>
</html>
