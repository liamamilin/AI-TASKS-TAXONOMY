<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>泡茶计时板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #f3ecdf; color: #1d1916;
      font-family: "Noto Serif SC", system-ui, sans-serif;
      display: grid; place-items: center; padding: 20px;
    }
    .board {
      width: min(640px, 100%); background: #fffaf2; border: 1px solid #dfd3bf;
      border-radius: 16px; padding: 24px; display: grid; gap: 16px;
      box-shadow: 0 16px 36px rgba(50, 34, 16, 0.09);
    }
    header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 22px; }
    .items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .item {
      border: 1px solid #dfd3bf; background: #f8f2e7; border-radius: 12px;
      padding: 16px 12px; text-align: center; display: grid; gap: 10px;
    }
    .item.done { background: #e8f3ea; border-color: #7eb589; }
    .time { font: 700 28px ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    button {
      border-radius: 999px; padding: 8px 14px; cursor: pointer; font: 600 13.5px inherit;
      border: 1px solid #1d1916; background: #1d1916; color: #fffaf2;
    }
    button.ghost { background: transparent; color: #1d1916; border-color: #cbbba2; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .banner {
      min-height: 28px; text-align: center; font-size: 18px; font-weight: 700; color: #2b6e3f;
    }
    @media (max-width: 560px) { .items { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="board">
    <header>
      <h1>泡茶计时板</h1>
      <div style="display:flex;gap:8px;">
        <button type="button" id="start-all">三项同时开始</button>
        <button type="button" class="ghost" id="reset-all">全部重置</button>
      </div>
    </header>
    <section class="items" id="items"></section>
    <p class="banner" id="banner" role="status"></p>
  </main>
  <script>
    const TASKS = [
      { id: "boil", name: "烧水", total: 480 },
      { id: "wash", name: "洗杯", total: 120 },
      { id: "tea",  name: "找茶叶", total: 60 },
    ];
    const state = TASKS.map((t) => ({ ...t, left: t.total, running: false, done: false }));
    const itemsEl = document.getElementById("items");
    const bannerEl = document.getElementById("banner");

    const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

    function render() {
      itemsEl.innerHTML = state.map((t, i) => `
        <article class="item ${t.done ? "done" : ""}">
          <strong>${t.name}</strong>
          <div class="time">${fmt(t.left)}</div>
          <button type="button" data-start="${i}" ${t.running || t.done ? "disabled" : ""}>${t.done ? "已完成" : (t.running ? "计时中" : "开始")}</button>
        </article>
      `).join("");
      bannerEl.textContent = state.every((t) => t.done) ? "可以泡了" : "";
    }

    itemsEl.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-start]");
      if (!btn) return;
      const item = state[Number(btn.dataset.start)];
      if (!item.done) item.running = true;
      render();
    });
    document.getElementById("start-all").addEventListener("click", () => {
      state.forEach((t) => { if (!t.done) t.running = true; });
      render();
    });
    document.getElementById("reset-all").addEventListener("click", () => {
      state.forEach((t) => { t.left = t.total; t.running = false; t.done = false; });
      render();
    });

    setInterval(() => {
      let changed = false;
      for (const t of state) {
        if (t.running && !t.done) {
          t.left = Math.max(0, t.left - 1);
          if (t.left === 0) { t.running = false; t.done = true; }
          changed = true;
        }
      }
      if (changed) render();
    }, 1000);

    render();
  </script>
</body>
</html>
