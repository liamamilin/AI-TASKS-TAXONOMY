<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>程序化极光夜空</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #040812; font-family: "Noto Serif SC", system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; cursor: move; }
    .hud {
      position: fixed; left: 14px; top: 12px; display: flex; gap: 10px; align-items: center;
      background: rgba(8, 14, 26, 0.78); color: #e2f5f0; border: 1px solid rgba(120, 235, 200, 0.24);
      border-radius: 999px; padding: 7px 14px; font-size: 12.5px;
    }
    .hud input[type="range"] { width: 78px; accent-color: #4ff0b8; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="hud">
    <span>极光夜空</span>
    <label>强度 <input id="amp" type="range" min="0.4" max="1.8" step="0.1" value="1.1"></label>
    <label>流速 <input id="spd" type="range" min="0.2" max="2.5" step="0.1" value="1.0"></label>
  </div>
  <script>
    const canvas = document.getElementById("gl");
    const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    const ampEl = document.getElementById("amp");
    const spdEl = document.getElementById("spd");
    let mx = 0.5, my = 0.5;
    canvas.addEventListener("pointermove", (e) => { mx = e.clientX / innerWidth; my = e.clientY / innerHeight; });
    function resize() {
      const dpr = Math.min(devicePixelRatio || 1, 1.5);
      canvas.width = Math.floor(innerWidth * dpr); canvas.height = Math.floor(innerHeight * dpr);
      if (gl) gl.viewport(0, 0, canvas.width, canvas.height);
    }
    window.addEventListener("resize", resize); resize();

    if (gl) {
      const vs = `attribute vec2 p; void main(){ gl_Position=vec4(p,0.,1.); }`;
      const fs = `
        precision highp float;
        uniform vec2 u_res;
        uniform float u_t;
        uniform float u_amp;
        uniform vec2 u_m;

        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float noise(vec2 p){
          vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
          return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
        }
        float fbm(vec2 p){
          float v=0., a=0.5;
          for(int i=0;i<4;i++){ v+=a*noise(p); p*=2.05; a*=0.5; }
          return v;
        }
        void main(){
          vec2 uv = gl_FragCoord.xy / u_res;
          vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
          p.x += (u_m.x - 0.5) * 0.25;

          // Deep arctic night sky
          vec3 sky = mix(vec3(0.02, 0.05, 0.11), vec3(0.01, 0.02, 0.05), uv.y);

          // Twinkling stars
          vec2 sg = floor(uv * vec2(180.0, 100.0));
          float st = step(0.992, hash(sg)) * (0.5 + 0.5 * sin(u_t * 3.0 + hash(sg) * 40.0));
          sky += vec3(0.85, 0.92, 1.0) * st * smoothstep(0.25, 0.65, uv.y);

          // Layered aurora curtains
          vec3 aurora = vec3(0.0);
          for(int i=0; i<4; i++){
            float fi = float(i);
            float wave = sin(p.x * (2.6 + fi * 0.7) + u_t * (0.45 + fi * 0.12) + fbm(vec2(p.x * 2.0, u_t * 0.2 + fi)) * 2.4);
            float yBand = 0.12 + fi * 0.08 + wave * 0.09;
            float dist = abs(p.y - yBand);
            float curtain = exp(-dist * (9.5 - fi * 1.2)) * smoothstep(-0.1, 0.42, p.y);
            float rays = 0.55 + 0.45 * noise(vec2(p.x * 16.0 + fi * 5.0, u_t * 0.7));
            vec3 c1 = mix(vec3(0.12, 0.95, 0.62), vec3(0.45, 0.32, 0.95), smoothstep(0.05, 0.45, p.y - yBand + 0.12));
            aurora += c1 * curtain * rays * 0.48;
          }
          vec3 col = sky + aurora * u_amp;

          // Mountain silhouette + lake reflection
          float mH = 0.24 + 0.09 * fbm(vec2(uv.x * 5.5 + u_m.x * 0.3, 1.2));
          if (uv.y < mH) {
            if (uv.y < 0.16) {
              // Lake reflection
              vec2 ruv = vec2(uv.x, 0.32 - uv.y);
              float rip = sin(uv.y * 140.0 + u_t * 4.0) * 0.008;
              vec3 refl = sky + aurora * u_amp * 0.55 * (0.7 + 0.3 * sin(ruv.x * 30.0 + rip * 80.0));
              col = mix(vec3(0.02, 0.04, 0.07), refl, 0.72);
            } else {
              col = vec3(0.03, 0.04, 0.06);
            }
          }
          gl_FragColor = vec4(pow(col, vec3(0.9)), 1.0);
        }
      `;
      const compile = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
      const prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog); gl.useProgram(prog);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const uRes = gl.getUniformLocation(prog, "u_res"), uT = gl.getUniformLocation(prog, "u_t");
      const uAmp = gl.getUniformLocation(prog, "u_amp"), uM = gl.getUniformLocation(prog, "u_m");
      let t = 0, last = performance.now();
      function render(now) {
        const dt = Math.min(0.05, (now - last) / 1000); last = now;
        t += dt * Number(spdEl.value);
        gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.uniform1f(uT, t); gl.uniform1f(uAmp, Number(ampEl.value)); gl.uniform2f(uM, mx, my);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(render);
      }
      requestAnimationFrame(render);
    }
  </script>
</body>
</html>
