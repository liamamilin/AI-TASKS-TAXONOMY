<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Single-File Tetris</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #12151e; color: #eef2fa;
      font-family: system-ui, -apple-system, sans-serif;
      display: grid; place-items: center; padding: 16px;
    }
    .wrap { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
    canvas#board {
      background: #0b0d14; border: 2px solid #2b3348; border-radius: 10px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .45); display: block;
    }
    .side {
      width: 170px; display: flex; flex-direction: column; gap: 12px;
      background: #1a1f2e; border: 1px solid #2b3348; border-radius: 12px; padding: 14px;
    }
    .stat { display: flex; justify-content: space-between; font-size: 14px; }
    .stat b { font-size: 18px; color: #ffd166; font-variant-numeric: tabular-nums; }
    canvas#next { background: #0b0d14; border-radius: 8px; display: block; margin: 0 auto; }
    .btn {
      background: #3a6ea5; color: #fff; border: 0; border-radius: 999px;
      padding: 8px 14px; cursor: pointer; font: inherit; font-weight: 600;
    }
    .hint { font-size: 12px; color: #9ba7c0; line-height: 1.55; }
    .over { color: #ff6b6b; font-weight: 700; min-height: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="board" width="260" height="520"></canvas>
    <aside class="side">
      <div class="stat"><span>Score</span><b id="score">0</b></div>
      <div class="stat"><span>Lines</span><b id="lines">0</b></div>
      <div class="stat"><span>Level</span><b id="level">1</b></div>
      <div style="font-size:12px;color:#9ba7c0;">Next</div>
      <canvas id="next" width="120" height="100"></canvas>
      <div class="over" id="over"></div>
      <button class="btn" id="restart" type="button">Restart</button>
      <p class="hint">← → Move · ↑ Rotate<br>↓ Soft Drop · Space Hard Drop<br>P Pause</p>
    </aside>
  </div>
  <script>
    const COLS = 10, ROWS = 20, CELL = 26;
    const boardCanvas = document.getElementById("board");
    const ctx = boardCanvas.getContext("2d");
    const nextCanvas = document.getElementById("next");
    const nctx = nextCanvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const linesEl = document.getElementById("lines");
    const levelEl = document.getElementById("level");
    const overEl = document.getElementById("over");

    const SHAPES = [
      { m: [[1,1,1,1]], c: "#4cc9f0" },
      { m: [[1,1],[1,1]], c: "#ffd166" },
      { m: [[0,1,0],[1,1,1]], c: "#b565f7" },
      { m: [[0,1,1],[1,1,0]], c: "#52d681" },
      { m: [[1,1,0],[0,1,1]], c: "#ff5c6c" },
      { m: [[1,0,0],[1,1,1]], c: "#4d8bf5" },
      { m: [[0,0,1],[1,1,1]], c: "#ff9f43" },
    ];

    let grid, cur, nextPiece, bag, score, lines, level, over, paused, dropAcc, last;

    function refillBag() {
      bag = [0,1,2,3,4,5,6];
      for (let i = bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [bag[i], bag[j]] = [bag[j], bag[i]];
      }
    }
    function pullPiece() {
      if (!bag.length) refillBag();
      const s = SHAPES[bag.pop()];
      return { m: s.m.map((r) => [...r]), c: s.c, x: Math.floor((COLS - s.m[0].length) / 2), y: 0 };
    }
    function collides(piece, dx = 0, dy = 0, mat = piece.m) {
      for (let r = 0; r < mat.length; r++) {
        for (let c = 0; c < mat[r].length; c++) {
          if (!mat[r][c]) continue;
          const nx = piece.x + c + dx, ny = piece.y + r + dy;
          if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
          if (ny >= 0 && grid[ny][nx]) return true;
        }
      }
      return false;
    }
    function rotateMat(m) {
      return m[0].map((_, i) => m.map((row) => row[i]).reverse());
    }
    function tryRotate() {
      const rot = rotateMat(cur.m);
      for (const kick of [0, -1, 1, -2, 2]) {
        if (!collides(cur, kick, 0, rot)) { cur.m = rot; cur.x += kick; return; }
      }
    }
    function lock() {
      for (let r = 0; r < cur.m.length; r++) {
        for (let c = 0; c < cur.m[r].length; c++) {
          if (cur.m[r][c] && cur.y + r >= 0) grid[cur.y + r][cur.x + c] = cur.c;
        }
      }
      let cleared = 0;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (grid[r].every(Boolean)) {
          grid.splice(r, 1);
          grid.unshift(Array(COLS).fill(null));
          cleared++;
          r++;
        }
      }
      if (cleared) {
        lines += cleared;
        score += [0, 100, 300, 500, 800][cleared] * level;
        level = 1 + Math.floor(lines / 10);
        scoreEl.textContent = String(score);
        linesEl.textContent = String(lines);
        levelEl.textContent = String(level);
      }
      cur = nextPiece;
      nextPiece = pullPiece();
      if (collides(cur)) {
        over = true;
        overEl.textContent = "GAME OVER";
      }
      drawNext();
    }
    function drawCell(g, x, y, color, alpha = 1) {
      g.save();
      g.globalAlpha = alpha;
      g.fillStyle = color;
      g.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
      g.fillStyle = "rgba(255,255,255,0.22)";
      g.fillRect(x * CELL + 2, y * CELL + 2, CELL - 4, 4);
      g.restore();
    }
    function drawNext() {
      nctx.fillStyle = "#0b0d14";
      nctx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      const m = nextPiece.m;
      const offX = (nextCanvas.width - m[0].length * 22) / 2;
      const offY = (nextCanvas.height - m.length * 22) / 2;
      for (let r = 0; r < m.length; r++) {
        for (let c = 0; c < m[r].length; c++) {
          if (!m[r][c]) continue;
          nctx.fillStyle = nextPiece.c;
          nctx.fillRect(offX + c * 22 + 1, offY + r * 22 + 1, 20, 20);
        }
      }
    }
    function draw() {
      ctx.fillStyle = "#0b0d14";
      ctx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
      ctx.strokeStyle = "rgba(255,255,255,0.04)";
      for (let x = 1; x < COLS; x++) { ctx.beginPath(); ctx.moveTo(x*CELL, 0); ctx.lineTo(x*CELL, ROWS*CELL); ctx.stroke(); }
      for (let y = 1; y < ROWS; y++) { ctx.beginPath(); ctx.moveTo(0, y*CELL); ctx.lineTo(COLS*CELL, y*CELL); ctx.stroke(); }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[r][c]) drawCell(ctx, c, r, grid[r][c]);
        }
      }
      if (!over) {
        let gy = 0;
        while (!collides(cur, 0, gy + 1)) gy++;
        for (let r = 0; r < cur.m.length; r++) {
          for (let c = 0; c < cur.m[r].length; c++) {
            if (cur.m[r][c]) {
              drawCell(ctx, cur.x + c, cur.y + r + gy, cur.c, 0.22);
              drawCell(ctx, cur.x + c, cur.y + r, cur.c, 1);
            }
          }
        }
      }
    }
    function reset() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      bag = []; score = 0; lines = 0; level = 1; over = false; paused = false; dropAcc = 0;
      scoreEl.textContent = "0"; linesEl.textContent = "0"; levelEl.textContent = "1"; overEl.textContent = "";
      cur = pullPiece(); nextPiece = pullPiece(); drawNext();
    }

    window.addEventListener("keydown", (e) => {
      if (e.code === "KeyP") { paused = !paused; return; }
      if (over || paused) return;
      if (e.code === "ArrowLeft" && !collides(cur, -1, 0)) cur.x--;
      else if (e.code === "ArrowRight" && !collides(cur, 1, 0)) cur.x++;
      else if (e.code === "ArrowDown") { if (!collides(cur, 0, 1)) cur.y++; else lock(); }
      else if (e.code === "ArrowUp") tryRotate();
      else if (e.code === "Space") { e.preventDefault(); while (!collides(cur, 0, 1)) cur.y++; lock(); }
    });
    document.getElementById("restart").addEventListener("click", reset);

    reset();
    last = performance.now();
    function loop(now) {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      if (!over && !paused) {
        dropAcc += dt;
        const interval = Math.max(0.1, 0.72 - (level - 1) * 0.06);
        if (dropAcc >= interval) {
          dropAcc = 0;
          if (!collides(cur, 0, 1)) cur.y++;
          else lock();
        }
      }
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
