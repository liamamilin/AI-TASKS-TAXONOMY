<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Three.js Voxel World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #8ecae6; font-family: system-ui, sans-serif; }
    .hud {
      position: fixed; left: 14px; top: 12px; background: rgba(18, 22, 28, 0.78); color: #f2f5fa;
      padding: 8px 14px; border-radius: 10px; font-size: 12.5px; line-height: 1.5;
    }
    .cross {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; pointer-events: none;
    }
    .cross::before, .cross::after { content: ""; position: absolute; background: rgba(255,255,255,0.85); }
    .cross::before { left: 6px; top: 0; width: 2px; height: 14px; }
    .cross::after { left: 0; top: 6px; width: 14px; height: 2px; }
  </style>
</head>
<body>
  <div class="hud">WASD: Move · Drag / Arrows: Look · Space: Jump · No Audio</div>
  <div class="cross"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    function makeTex(base, speck1, speck2) {
      const c = document.createElement("canvas");
      c.width = 32; c.height = 32;
      const g = c.getContext("2d");
      g.fillStyle = base; g.fillRect(0, 0, 32, 32);
      for (let y = 0; y < 32; y += 4) {
        for (let x = 0; x < 32; x += 4) {
          const r = ((x * 37 + y * 17) % 11);
          if (r < 3) { g.fillStyle = speck1; g.fillRect(x, y, 4, 4); }
          else if (r > 8) { g.fillStyle = speck2; g.fillRect(x, y, 4, 4); }
        }
      }
      const tex = new THREE.CanvasTexture(c);
      tex.magFilter = THREE.NearestFilter;
      return tex;
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x98d4f0);
    scene.fog = new THREE.Fog(0x98d4f0, 24, 65);

    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 150);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sun = new THREE.DirectionalLight(0xfff5dc, 0.85);
    sun.position.set(24, 38, 18);
    scene.add(sun);

    const mats = {
      grass: new THREE.MeshLambertMaterial({ map: makeTex("#5ca148", "#4d8a3b", "#6fb559") }),
      sand:  new THREE.MeshLambertMaterial({ map: makeTex("#e6d29c", "#d9c284", "#f0dfae") }),
      stone: new THREE.MeshLambertMaterial({ map: makeTex("#878c94", "#727780", "#9ba0a8") }),
      wood:  new THREE.MeshLambertMaterial({ map: makeTex("#7a5536", "#634328", "#8d6442") }),
      leaf:  new THREE.MeshLambertMaterial({ map: makeTex("#3d7d3a", "#2f662d", "#4f944b") }),
      water: new THREE.MeshLambertMaterial({ map: makeTex("#3a8ec4", "#2f7eb0", "#5aa8db"), transparent: true, opacity: 0.78 }),
    };

    const geo = new THREE.BoxGeometry(1, 1, 1);
    const SIZE = 26;
    const WATER_Y = 0;

    function addBlock(x, y, z, mat) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      scene.add(m);
    }

    for (let x = -SIZE / 2; x <= SIZE / 2; x++) {
      for (let z = -SIZE / 2; z <= SIZE / 2; z++) {
        const h = Math.round(Math.sin(x * 0.24) * Math.cos(z * 0.22) * 2.4 + Math.sin((x + z) * 0.14) * 1.3);
        if (h < WATER_Y) {
          addBlock(x, h, z, mats.sand);
          addBlock(x, WATER_Y, z, mats.water);
        } else {
          const topMat = h === WATER_Y ? mats.sand : (h >= 3 ? mats.stone : mats.grass);
          addBlock(x, h, z, topMat);
          addBlock(x, h - 1, z, mats.stone);
          if (topMat === mats.grass && ((x * 13 + z * 29) & 31) === 3 && Math.hypot(x, z) > 4) {
            for (let ty = 1; ty <= 3; ty++) addBlock(x, h + ty, z, mats.wood);
            for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) addBlock(x + dx, h + 4, z + dz, mats.leaf);
            addBlock(x, h + 5, z, mats.leaf);
          }
        }
      }
    }

    const player = { x: 0, y: 4.5, z: 7, yaw: 0, pitch: -0.18, vy: 0 };
    const keys = {};
    let dragging = false, lx = 0, ly = 0;
    window.addEventListener("keydown", (e) => { keys[e.code] = true; if (e.code === "Space" && player.y <= 3.6) player.vy = 6.2; });
    window.addEventListener("keyup", (e) => { keys[e.code] = false; });
    renderer.domElement.addEventListener("pointerdown", (e) => { dragging = true; lx = e.clientX; ly = e.clientY; });
    window.addEventListener("pointerup", () => { dragging = false; });
    window.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      player.yaw -= (e.clientX - lx) * 0.005;
      player.pitch = Math.max(-1.1, Math.min(1.1, player.pitch - (e.clientY - ly) * 0.005));
      lx = e.clientX; ly = e.clientY;
    });
    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    let last = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;

      if (keys["ArrowLeft"]) player.yaw += 1.6 * dt;
      if (keys["ArrowRight"]) player.yaw -= 1.6 * dt;
      const spd = 6.5 * dt;
      const fwdX = -Math.sin(player.yaw), fwdZ = -Math.cos(player.yaw);
      const rgtX = Math.cos(player.yaw), rgtZ = -Math.sin(player.yaw);
      if (keys["KeyW"] || keys["ArrowUp"]) { player.x += fwdX * spd; player.z += fwdZ * spd; }
      if (keys["KeyS"] || keys["ArrowDown"]) { player.x -= fwdX * spd; player.z -= fwdZ * spd; }
      if (keys["KeyA"]) { player.x -= rgtX * spd; player.z -= rgtZ * spd; }
      if (keys["KeyD"]) { player.x += rgtX * spd; player.z += rgtZ * spd; }

      player.vy -= 14 * dt;
      player.y = Math.max(3.5, player.y + player.vy * dt);
      if (player.y === 3.5) player.vy = 0;

      camera.position.set(player.x, player.y, player.z);
      camera.rotation.order = "YXZ";
      camera.rotation.y = player.yaw;
      camera.rotation.x = player.pitch;
      renderer.render(scene, camera);
    }
    animate(performance.now());
  </script>
</body>
</html>
