<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸上生烟</title><style>*{box-sizing:border-box}body{margin:0;background:#101c28;color:#edf1e9;font:15px system-ui;display:grid;grid-template-columns:260px 1fr;height:100vh}aside{padding:24px;background:#162635}canvas{width:100%;height:100%}input{width:100%}button{padding:10px;border:0;border-radius:8px;background:#ddb06b;color:#17242b}</style><aside><h1>纸上生烟</h1><p>点击或拖动落墨，看墨韵流淌卷曲。</p><label>墨浓 <span id="v">.7</span><input id="dark" type="range" min=".2" max="1" value=".7" step=".01"></label><button id="clear">留白重置</button><p>实时程序宣纸纹理</p></aside><canvas id="c"></canvas><script>let c=document.querySelector('canvas'),g=c.getContext('webgl');let vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';let fs='precision highp float;uniform vec2 r,d[12];uniform float tm,dark;uniform int n;float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}void main(){vec2 uv=gl_FragCoord.xy/r;float fiber=noise(uv*vec2(1100.,800.));vec3 col=vec3(.83,.78,.67)+.08*(fiber-.5);float ink=0.;for(int i=0;i<12;i++){if(i<n){vec2 z=uv-d[i];float rad=length(z),curl=.012*sin(rad*90.-tm*2.+atan(z.y,z.x)*3.);float spread=.025+mod(tm*.01+float(i)*.03,.32);ink=max(ink,exp(-pow((rad+curl)/spread,1.5)));}}ink=max(ink,pow(noise(uv*20.+tm*.04),9.)*.2);col=mix(col,vec3(.025,.035,.038),min(.94,ink*dark));gl_FragColor=vec4(col,1.);}';function S(t,s){let x=g.createShader(t);g.shaderSource(x,s);g.compileShader(x);return x}let p=g.createProgram();g.attachShader(p,S(g.VERTEX_SHADER,vs));g.attachShader(p,S(g.FRAGMENT_SHADER,fs));g.linkProgram(p);g.useProgram(p);let b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);let a=g.getAttribLocation(p,'p');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);let drops=[];function add(e){let x=c.getBoundingClientRect();drops.push([(e.clientX-x.left)/x.width,1-(e.clientY-x.top)/x.height]);if(drops.length>12)drops.shift()}c.onpointerdown=e=>{add(e);c.onpointermove=add};onpointerup=()=>c.onpointermove=null;document.querySelector('#clear').onclick=()=>drops=[];let sl=document.querySelector('#dark');sl.oninput=()=>document.querySelector('#v').textContent=sl.value;function draw(t){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;g.viewport(0,0,c.width,c.height);g.uniform2f(g.getUniformLocation(p,'r'),c.width,c.height);g.uniform1f(g.getUniformLocation(p,'tm'),t/1000);g.uniform1f(g.getUniformLocation(p,'dark'),+sl.value);g.uniform1i(g.getUniformLocation(p,'n'),drops.length);g.uniform2fv(g.getUniformLocation(p,'d[0]'),new Float32Array(Array.from({length:12},(_,i)=>drops[i]||[0,0]).flat()));g.drawArrays(g.TRIANGLE_STRIP,0,4);requestAnimationFrame(draw)}requestAnimationFrame(draw);</script>
