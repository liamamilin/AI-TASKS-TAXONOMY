<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daybreak OS</title><style>*{box-sizing:border-box}*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#1d3146}#desktop{height:100vh;position:relative;background:linear-gradient(140deg,#82c5c0,#d7ba9a 55%,#627fa1);overflow:hidden}#bar{height:38px;background:#f1f5eddd;backdrop-filter:blur(14px);display:flex;justify-content:space-between;padding:8px 18px}.icons{display:grid;gap:14px;padding:25px;width:110px}.icons button{background:#f5f6ec99;border:1px solid #ffffff88;border-radius:12px;padding:12px;color:#102b3c;cursor:pointer}#window{position:absolute;top:14%;left:25%;width:min(680px,70vw);height:65vh;background:#f7f5eeed;backdrop-filter:blur(18px);border:1px solid white;border-radius:18px;box-shadow:0 25px 90px #17374655;overflow:hidden}.title{height:42px;background:#e7e8df;display:flex;justify-content:space-between;padding:8px 14px;font-weight:bold}.title button{border:0;background:#e1786c;color:white;border-radius:50%}#content{padding:22px;height:calc(100% - 42px);overflow:auto}textarea{width:100%;height:200px;border:1px solid #ccd;padding:12px;font:15px system-ui}#pad{background:white;border:1px solid #aaa;touch-action:none}.dock{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:18px;background:#f4f3e8bb;display:flex;gap:12px}.dock button{font-size:22px;border:0;border-radius:10px;padding:8px 15px}</style><div id="desktop"><div id="bar"><b>◉ Daybreak OS</b><span id="clock"></span></div><div class="icons"><button onclick="openApp('notes')">📝<br>Notes</button><button onclick="openApp('files')">🗂️<br>Files</button><button onclick="openApp('paint')">🎨<br>Paint</button><button onclick="openApp('video')">🎞️<br>Clip Studio</button><button onclick="openApp('weather')">🌦️<br>Weather</button></div><section id="window"><div class="title"><span id="appname">Welcome</span><button onclick="closeApp()">×</button></div><div id="content"><h1>Good morning, explorer.</h1><p>A quiet desktop for making things.</p><p>Choose Notes, Files, Paint, Clip Studio or Weather.</p></div></section><div class="dock"><button onclick="openApp('notes')">✎</button><button onclick="openApp('files')">▣</button><button onclick="openApp('paint')">◉</button><button onclick="openApp('video')">▶</button></div></div><script>let notes=localStorage.getItem('dayNotes')||'A thought for the morning…';function openApp(a){let title={'notes':'Notes','files':'Files','paint':'Paint','video':'Clip Studio','weather':'Weather'}[a];appname.textContent=title;if(a==='notes')content.innerHTML='<h2>Notes</h2><textarea id="note"></textarea><p>Saved locally as you type.</p>';if(a==='notes'){note.value=notes;note.oninput=()=>{notes=note.value;localStorage.setItem('dayNotes',notes)}}if(a==='files')content.innerHTML='<h2>Files</h2><p>On this device</p><ul><li>Welcome.txt <button onclick="alert('Daybreak OS — a small beginning.')">Open</button></li><li>Morning ideas.md <button onclick="alert('Ideas live here.')">Open</button></li><li>Untitled.canvas</li></ul><button onclick="alert('New folder created in this demo workspace.')">＋ New folder</button>';if(a==='paint')content.innerHTML='<h2>Paint pad</h2><p>Draw with pointer or touch.</p><input type="color" id="color" value="#247f91"><button onclick="clearPad()">Clear</button><br><canvas id="pad" width="600" height="300"></canvas>';if(a==='paint'){let q=pad.getContext('2d'),down=false;pad.onpointerdown=e=>{down=true;q.beginPath();q.moveTo(e.offsetX,e.offsetY)};pad.onpointerup=()=>down=false;pad.onpointermove=e=>{if(down){q.strokeStyle=color.value;q.lineWidth=4;q.lineTo(e.offsetX,e.offsetY);q.stroke()}}}if(a==='video')content.innerHTML='<h2>Clip Studio · 00:18</h2><p>Local timeline mockup</p><video controls style="width:100%;background:#24384c;height:230px"></video><div style="display:flex;gap:8px"><button onclick="alert('Clip trimmed to playhead.')">Trim</button><button onclick="alert('Title card added to timeline.')">＋ Title</button><button onclick="alert('Export preview ready in this demo.')">Export</button></div><p>▰ Opening light · ▰ River walk · ▰ End card</p>';if(a==='weather')content.innerHTML='<h2>Weather · fictional town</h2><div style="font-size:52px">🌤 18°</div><p>Soft cloud cover · Gentle east breeze</p><p>08:00 ☀ · 12:00 ◉ · 18:00 ☾</p>';window.style.display='block'}function closeApp(){window.style.display='none'}function clearPad(){pad.getContext('2d').clearRect(0,0,600,300)}setInterval(()=>clock.textContent=new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),1000);</script>
