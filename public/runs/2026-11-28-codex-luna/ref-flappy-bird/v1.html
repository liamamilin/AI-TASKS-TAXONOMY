<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paperwing Dash</title><style>*{box-sizing:border-box}body{background:#c8f1eb;text-align:center;color:#164b5a;font:16px system-ui}canvas{width:min(94vw,760px);background:linear-gradient(#90d6e0,#e1f4cf);border:6px solid white;border-radius:18px;display:block;margin:12px auto}button{padding:12px 20px;background:#e88c60;color:white;border:0;border-radius:10px}</style><main><h1>Paperwing Dash</h1><p>Space or click to flap through the gates.</p><canvas id="c" width="760" height="520"></canvas><button onclick="start()">Start / Restart</button><b id="score">Score 0</b></main><script>let x=c.getContext('2d'),y=250,v=0,gs=[],n=0,f=0,on=false;function start(){y=250;v=0;gs=[];n=0;f=0;on=true;loop()}function flap(){if(!on)start();v=-5.5}onkeydown=e=>{if(e.code==='Space'){e.preventDefault();flap()}};c.onclick=flap;function loop(){if(!on)return;f++;x.clearRect(0,0,760,520);x.fillStyle='#dff1d5';x.fillRect(0,450,760,70);if(f%100===0)gs.push({x:780,y:90+Math.random()*250,p:false});v+=.28;y+=v;gs.forEach(g=>{g.x-=3;x.fillStyle='#38977b';x.fillRect(g.x,0,55,g.y-75);x.fillRect(g.x,g.y+75,55,500-g.y);if(!g.p&&g.x<160){g.p=true;n++;score.textContent='Score '+n}if(g.x<178&&g.x+55>142&&(y<g.y-60||y>g.y+60))on=false});x.fillStyle='#ed8b62';x.beginPath();x.ellipse(160,y,18,14,0,0,7);x.fill();gs=gs.filter(g=>g.x>-70);if(y<0||y>440)on=false;if(on)requestAnimationFrame(loop);else{x.fillStyle='#173e4b';x.font='bold 30px system-ui';x.fillText('TRY AGAIN',300,260)}}</script>
