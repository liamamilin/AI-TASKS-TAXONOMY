<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>午夜邮局</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#eef5f5;color:#17252b}body{background:linear-gradient(135deg,#111d32,#30415a);color:#eff3ed}main{max-width:760px;margin:4vh auto;padding:22px}header{text-align:center;padding:20px}h1{font: bold 48px Georgia,serif;color:#f0c77a}article{background:#f5eddc;color:#242525;padding:32px;border-radius:18px;box-shadow:0 25px 70px #0006;line-height:1.9}#label{font-size:13px;color:#99754b;letter-spacing:.2em}#body{font-size:19px;min-height:155px}button{background:#29364b;color:#f3d390;border:1px solid #bc9b64;padding:11px 16px;margin:7px;border-radius:8px;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}footer{text-align:center}</style><main><header><small>一夜之间的七封信</small><h1>午夜邮局</h1><p>原创互动短篇 · 纸鸥邮差 / 守灯人 / 读者</p></header><article><div id="label"></div><p id="body"></p><div id="choices"></div><p id="state"></p></article><footer><button onclick="back()">← 后退</button><button onclick="restart()">重读</button><button onclick="download()">下载 reading-log.json</button></footer></main><script>const nodes={"A": {"label": "门厅", "body": "钟声落在门厅的木地板上，纸鸥邮差抖落翅尖的雾珠。守灯人把一盏小灯推向你，说午夜邮局只收愿意等候的信。墙上的潮汐钟停在零点，门外海面像一张尚未写字的纸。你摸到口袋里唯一的邮票。", "choices": [["先去柜台", "B"], ["先看灯塔", "C"]]}, "B": {"label": "柜台", "body": "柜台后堆着没有封口的信封，纸鸥邮差用翅膀压住最轻的一只。邮票边缘映出橘色灯光，仿佛它记得某个尚未到来的早晨。守灯人说，寄出的信会离开今晚；留下的信仍可以等你决定。", "choices": [["寄出第一封信", "D", 1], ["把邮票留着", "D", 0]]}, "C": {"label": "灯塔", "body": "灯塔窗格把海雾切成一片片微亮的蓝。守灯人守着旋转的光，说他每天都替迷路的人照看方向，却很少知道他们是否已经回家。纸鸥邮差静静停在栏杆上，等待你把夜晚的一小段时间交给谁。", "choices": [["回柜台", "B"], ["陪守灯人等天亮", "E1"]]}, "D": {"label": "分信台", "body": "分信台上有两条投递槽，一条通向海风，一条通向明天。纸鸥邮差没有催促，只把信封摆正。守灯人提醒你，邮票一旦贴上便随信远行；倘若还留在手里，明日仍会有选择。", "choices": [["寄给明天", "E2", 1], ["把信读给海风", "E3"]]}, "E1": {"label": "结局：守候", "body": "天色渐淡时，你陪守灯人坐到最后一颗星隐去。灯塔的光不再像命令，而像有人仍在远处记得路。纸鸥邮差把空信封折成小船放入潮池。没有寄出的消息留在心里，成为下一次相逢时可以说的话。", "choices": []}, "E2": {"label": "结局：送达", "body": "你把邮票贴在信封上，纸鸥邮差迎着晨风飞出窗口。很久以后，远方亮起一格温暖的窗，像一句终于抵达的回答。守灯人转动灯塔，让光越过海湾。你知道收信的人未必立刻回信，但等待已经有了方向。", "choices": []}, "E3": {"label": "结局：放下", "body": "你把信读给海风听，字句离开舌尖后变得轻盈。海浪没有替任何人答复，只把声音带到更宽阔的地方。纸鸥邮差收好空信封，守灯人吹灭桌边的灯。你带着空出的手走回清晨，心里少了一块石头。", "choices": []}};let path=[{node:'A',stamps:1,choice:null}],cur=0;function draw(){let s=path[cur],n=nodes[s.node];label.textContent=n.label;body.textContent=n.body;state.textContent=`邮票：${s.stamps}`;choices.replaceChildren();n.choices.forEach(c=>{let b=document.createElement('button');b.textContent=c[0];let blocked=(s.node==='D'&&c[1]==='E2'&&s.stamps<1)||(c.length>2&&s.stamps<c[2]);b.disabled=blocked;if(blocked)b.title='邮票已用完，不能寄给明天';b.onclick=()=>choose(c);choices.append(b)});if(s.node==='B'&&s.stamps===0){let note=document.createElement('p');note.textContent='禁用“寄给明天”：邮票已在柜台贴出。';choices.append(note)} }function choose(c){let s=path[cur],spend=c[2]||0;if(s.stamps<spend)return;let next={node:c[1],stamps:s.stamps-spend,choice:c[0]};path=path.slice(0,cur+1);path.push(next);cur++;draw()}function back(){if(cur>0){cur--;draw()}}function restart(){path=[{node:'A',stamps:1,choice:null}];cur=0;draw()}function download(){let blob={title:'午夜邮局',initial:{stamps:1},choices:path.slice(1).map(x=>({node:x.node,choice:x.choice,stampsAfter:x.stamps})),ending:path[cur].node,stamps:path[cur].stamps};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(blob,null,2)]));a.download='reading-log.json';a.click()}draw();</script></html>
