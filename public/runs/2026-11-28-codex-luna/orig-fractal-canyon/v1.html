<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>砂岩分形峡谷</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#eef5f5;color:#17252b}html,body{margin:0;height:100%;overflow:hidden;background:#180d17}canvas{width:100%;height:100%;display:block}.ui{position:fixed;left:22px;top:20px;color:#ffe7c8;background:#241c28c9;padding:14px 18px;border:1px solid #c1805c;border-radius:12px}.ui button{margin:0 12px;padding:8px 12px;background:#bc694e;color:white;border:0;border-radius:7px}small{opacity:.7}</style><canvas id="c"></canvas><div class="ui"><b>砂岩峡谷 · 巡航</b><button id="toggle">暂停巡航</button><small>WASD 调整视线</small></div><script>const gl=document.querySelector('canvas').getContext('webgl');const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}`;const fs=`precision highp float;uniform vec2 r;uniform float t;uniform vec2 look;float hash(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}float noise(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}float terrain(vec3 p){float fold=abs(p.x);for(int i=0;i<5;i++){p=abs(p)-vec3(1.8,.4,2.0);p.xz*=mat2(.8,-.6,.6,.8);fold=min(fold,length(p.xz)*.55);}float n=noise(p*3.)*.23+noise(p*8.)*.04;float wall=2.9+sin(p.z*1.4)*.65+n;float floorD=p.y+1.1+n*.35;float arch=abs(p.y-(.7+1.5*sin(p.x*1.2)))-.12;float rib=abs(mod(p.z+1.6,3.2)-1.6)-.18;return min(max(fold-wall,floorD), max(fold-wall,arch+rib));}vec3 get(vec3 ro,vec3 rd){float d=0.;float h;for(int i=0;i<90;i++){vec3 p=ro+rd*d;h=terrain(p);d+=max(.025,abs(h)*.55);if(d>35.||abs(h)<.012)break;}if(d>35.)return vec3(.1,.14,.26)+vec3(.55,.19,.12)*exp(-rd.y*3.);vec3 p=ro+rd*d;float e=.02;vec3 n=normalize(vec3(terrain(p+vec3(e,0,0))-terrain(p-vec3(e,0,0)),terrain(p+vec3(0,e,0))-terrain(p-vec3(0,e,0)),terrain(p+vec3(0,0,e))-terrain(p-vec3(0,0,e))));float light=.28+.72*max(0.,dot(n,normalize(vec3(-.6,.8,-.3))));float bands=.82+.18*sin(p.y*22.+noise(p*4.)*4.);vec3 rock=vec3(.64,.27,.16)*light*bands;float fog=smoothstep(8.,30.,d);vec3 sky=mix(vec3(.96,.38,.19),vec3(.12,.12,.31),clamp(rd.y+.2,0.,1.));return mix(rock,sky,fog);}void main(){vec2 uv=(gl_FragCoord.xy-.5*r)/r.y;float yaw=look.x;vec3 rd=normalize(vec3(uv.x+yaw,uv.y+look.y,1.));vec3 c=get(vec3(0.,.2,t*1.4),rd);gl_FragColor=vec4(c,1.);}`;function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s}let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);let loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);let paused=false,start=performance.now(),offset=0,look=[0,0];toggle.onclick=()=>{paused=!paused;toggle.textContent=paused?'继续巡航':'暂停巡航'};onkeydown=e=>{if(e.key==='a')look[0]-=.04;if(e.key==='d')look[0]+=.04;if(e.key==='w')look[1]+=.04;if(e.key==='s')look[1]-=.04};function frame(now){let w=canvas.width=innerWidth*devicePixelRatio,h=canvas.height=innerHeight*devicePixelRatio;gl.viewport(0,0,w,h);gl.uniform2f(gl.getUniformLocation(pr,'r'),w,h);if(!paused)offset=(now-start)/1000;gl.uniform1f(gl.getUniformLocation(pr,'t'),offset);gl.uniform2f(gl.getUniformLocation(pr,'look'),...look);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(frame)}requestAnimationFrame(frame);</script></html>
