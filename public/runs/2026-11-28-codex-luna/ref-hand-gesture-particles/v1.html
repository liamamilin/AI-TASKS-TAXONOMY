<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gesture Garden</title><style>body{margin:0;background:#0c121b;color:#e8f1f5;font:15px system-ui;display:grid;grid-template-columns:270px 1fr;height:100vh}aside{padding:24px;background:#131e2b}h1{font-size:22px}label{display:block;margin:18px 0}select,input,button{font:inherit;padding:9px;border-radius:8px}canvas{width:100%;height:100%}button{background:#71dfb2;border:0;cursor:pointer}.hint{color:#9eacba;font-size:13px;line-height:1.5}</style><aside><h1>Gesture Garden</h1><p>粒子形态实验台</p><label>模板 <select id="shape"><option>Heart</option><option>Flower</option><option>Saturn</option><option>Buddha</option><option>Fireworks</option></select></label><label>粒子颜色 <input type="color" id="color" value="#72edbd"></label><label>双手张力模拟 <input id="tension" type="range" min="0" max="100" value="45"></label><button id="camera">启用摄像头（此页不自动开启）</button><p class="hint">视觉交互预览用滑块演示手势张合；需要相机识别时可在安全来源由用户主动授权。此离线样例不会请求或读取摄像头。</p><output id="status">预览模式</output></aside><canvas></canvas><script>let c=document.querySelector('canvas'),x=c.getContext('2d'),pts=[];for(let i=0;i<1400;i++)pts.push({a:Math.random()*6.28,r:Math.random(),z:Math.random()*3});function draw(t){requestAnimationFrame(draw);c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let w=c.clientWidth,h=c.clientHeight,scale=1+(+tension.value)/45;x.fillStyle='#0c121b';x.fillRect(0,0,w,h);x.fillStyle=color.value;for(let p of pts){let r=p.r*140*scale,a=p.a+t*.0004;let xx,yy;if(shape.value==='Heart'){xx=16*Math.pow(Math.sin(a),3);yy=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));xx*=6*p.r;yy*=6*p.r}else if(shape.value==='Saturn'){xx=Math.cos(a)*r;yy=Math.sin(a)*r*.55;if(p.r>.76){xx=Math.cos(a)*r*1.5;yy=Math.sin(a)*r*.34}}else{xx=Math.cos(a*(shape.value==='Flower'?5:1))*r;yy=Math.sin(a*(shape.value==='Flower'?5:1))*r}x.globalAlpha=.45+.5*Math.sin(t*.002+p.a);x.beginPath();x.arc(w/2+xx,h/2+yy,1+p.r*1.5,0,7);x.fill()}x.globalAlpha=1}camera.onclick=()=>status.textContent='相机未启用：请使用张力滑块预览';requestAnimationFrame(draw)</script>
