<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>河湾渡船</title><style>body{font:16px system-ui;background:#e4f3ec;color:#183a38;text-align:center;padding:5vh}main{max-width:760px;margin:auto;background:white;padding:25px;border-radius:24px}.banks{display:flex;justify-content:space-around;align-items:center;background:#a7ddd5;padding:30px;border-radius:18px}.bank{width:34%;min-height:100px}.item{display:inline-block;padding:10px;margin:5px;background:#fff0cf;border-radius:12px;cursor:pointer}.sel{outline:3px solid coral}button{padding:10px 16px;border:0;border-radius:10px;background:#19524c;color:white}</style><main><h1>河湾渡船</h1><p>人和至多一件物品同行。无人看守时猫吃鱼，鱼吃鱼食。</p><div class="banks"><div id="a" class="bank"></div><div><div>⛵ <span id="boat">人</span></div><button id="go">渡河 ↔</button></div><div id="b" class="bank"></div></div><p id="msg">选择同行物品</p><p>次数：<b id="n">0</b></p><button id="reset">重置</button></main><script>let s={人:0,猫:0,鱼:0,鱼食:0},pick='人',n=0;function draw(){for(let side=0;side<2;side++){document.querySelector(side?'#b':'#a').innerHTML=Object.keys(s).filter(k=>s[k]===side).map(k=>`<span class="item ${pick===k?'sel':''}" data-k="${k}">${k}</span>`).join('')}document.querySelector('#n').textContent=n;document.querySelector('#boat').textContent=pick}document.onclick=e=>{if(e.target.dataset.k){pick=e.target.dataset.k;draw()}};document.querySelector('#go').onclick=()=>{if(s[pick]!==s.人)return msg.textContent='物品与人不在同一岸。';let old={...s},side=1-s.人;s.人=side;if(pick!=='人')s[pick]=side;n++;let bad=(s.人!==s.猫&&s.猫===s.鱼)||(s.人!==s.鱼&&s.鱼===s.鱼食);if(bad){s=old;n--;msg.textContent='非法局面：本次移动已取消。'}else if(Object.values(s).every(v=>v===1))msg.textContent=`全部抵达，共 ${n} 次！`;else msg.textContent='安全抵达。';pick='人';draw()};document.querySelector('#reset').onclick=()=>{s={人:0,猫:0,鱼:0,鱼食:0};n=0;pick='人';draw()};draw();</script>
