<!doctype html><meta charset="utf-8"><title>摆波墙</title><style>body{margin:0;background:#111b27;color:#eaf2ef;font:16px system-ui}canvas{display:block;width:100vw;height:calc(100vh - 90px)}header{padding:14px 22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}button{padding:8px 16px;border:0;border-radius:8px;background:#4bc99a;color:#10241d;font:inherit;cursor:pointer}</style><header><b>摆波墙 · 60秒回归周期</b><button id="pause">暂停</button><button id="reset">齐步释放重置</button><button id="view">切换俯视 / 正视</button><label>倍速 <input id="rate" type="range" min=".2" max="3" step=".1" value="1"><output>1×</output></label></header><canvas></canvas><script>let c=document.querySelector('canvas'),x=c.getContext('2d'),paused=false,topView=false,start=performance.now(),offset=0;pause.onclick=()=>{paused=!paused;pause.textContent=paused?'继续':'暂停';if(!paused)start=performance.now()-offset*1000};reset.onclick=()=>{offset=0;start=performance.now()};view.onclick=()=>topView=!topView;rate.oninput=()=>document.querySelector('output').value=rate.value+'×';function draw(t){requestAnimationFrame(draw);c.width=innerWidth*devicePixelRatio;c.height=(innerHeight-90)*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);if(!paused)offset=(t-start)/1000*rate.value;let w=innerWidth,h=innerHeight-90;x.fillStyle='#111b27';x.fillRect(0,0,w,h);for(let i=0;i<15;i++){let px=w*(i+1)/16,period=1.2+i*.18,ang=2*Math.PI*(offset%60)/period, len=70+i*3, bobx=px+Math.sin(ang)*len*.55,boby=topView?h*.32+Math.cos(ang)*45:h*.69+Math.cos(ang)*len;x.strokeStyle='#52697a';x.lineWidth=2;x.beginPath();x.moveTo(px,topView?h*.25:h*.1);x.lineTo(bobx,boby);x.stroke();x.fillStyle=`hsl(${155+i*5} 65% 65%)`;x.beginPath();x.arc(bobx,boby,6,0,7);x.fill()}x.fillStyle='#eaf2ef';x.fillText('时间 '+(offset%60).toFixed(1)+'s / 60s',18,25)}requestAnimationFrame(draw)</script>
