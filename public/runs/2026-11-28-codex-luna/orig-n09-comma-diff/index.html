<!doctype html><meta charset="utf-8"><title>字间差</title><style>body{font:16px system-ui;background:#f5f3ee;color:#292c2b;padding:24px}main{max-width:900px;margin:auto}textarea{width:46%;height:120px}section{display:inline-block;vertical-align:top;width:48%;white-space:pre-wrap;background:white;padding:12px;min-height:120px}.del{background:#ffd9d5;text-decoration:line-through}.ins{background:#c6f1dc}button{padding:9px}</style><main><h1>字间差</h1><textarea id="a"></textarea><textarea id="b"></textarea><p><button id="swap">互换</button><button id="copy">复制纯文本</button><button id="download">下载 diff.json</button> <b id="cost"></b></p><section id="left"></section><section id="right"></section></main><script>const A="星港📮开门了\n周六 10:00见。\n请带纸船。",B="星港📮开门啦\n周日 10:30见。\n请带纸船！";a.value=A;b.value=B;function calc(x,y){x=Array.from(x);y=Array.from(y);let d=Array.from({length:x.length+1},()=>Array(y.length+1).fill(0));for(let i=x.length-1;i>=0;i--)for(let j=y.length-1;j>=0;j--)d[i][j]=x[i]===y[j]?1+d[i+1][j+1]:Math.max(d[i+1][j],d[i][j+1]);let s=[],add=(type,c)=>{if(s.length&&s.at(-1).type===type)s.at(-1).text+=c;else s.push({type,text:c})};let i=0,j=0;while(i<x.length||j<y.length){if(i<x.length&&j<y.length&&x[i]===y[j])add('equal',x[i++]),j++;else if(i<x.length&&(j===y.length||d[i+1][j]>=d[i][j+1]))add('delete',x[i++]);else add('insert',y[j++])}return s}let seg=[];function draw(){seg=calc(a.value,b.value);left.replaceChildren();right.replaceChildren();for(let s of seg){let e=document.createElement('span');e.textContent=s.text;e.className=s.type==='delete'?'del':s.type==='insert'?'ins':'';if(s.type!=='insert')left.append(e.cloneNode(true));if(s.type!=='delete')right.append(e)}cost.textContent='最小代价 '+seg.filter(s=>s.type!=='equal').reduce((n,s)=>n+Array.from(s.text).length,0); }a.oninput=b.oninput=draw;swap.onclick=()=>{let t=a.value;a.value=b.value;b.value=t;draw()};copy.onclick=()=>navigator.clipboard?.writeText(b.value);download.onclick=()=>{let o={old:a.value,new:b.value,segments:seg,cost:seg.filter(s=>s.type!=='equal').reduce((n,s)=>n+Array.from(s.text).length,0)};let q=document.createElement('a');q.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));q.download='diff.json';q.click()};draw()</script>
