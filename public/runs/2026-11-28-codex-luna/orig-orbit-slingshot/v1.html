<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轨道信使</title><style>*{box-sizing:border-box}body{margin:0;background:#111a30;color:#eee;font:16px system-ui}main{max-width:950px;margin:25px auto}button{padding:10px;background:#d5aa54;border:0;border-radius:8px;margin:8px}canvas{width:100%;background:#11182b;border-radius:18px}b{margin:20px;color:#ffd777}</style><main><h1>轨道信使</h1><p>调仰角与速度，避开引力核心抵达金色信标。</p><label>角度 <input id="ang" type="range" min="10" max="80" value="40"></label><label>速度 <input id="spd" type="range" min="2" max="8" step=".1" value="5"></label><button id="fire">发射</button><button id="reset">重置</button><button id="next">下一关</button><b id="msg">第1关</b><canvas id="c" width="900" height="470"></canvas></main><script>let ctx=c.getContext('2d'),lev=0,planets=[[610,330],[490,250],[630,150]],beacons=[[805,120],[790,330],[800,90]],p=[90,360],v=[0,0],active=false,ok=false;function path(){let a=+ang.value*Math.PI/180,x=90,y=360,vx=+spd.value*Math.cos(a),vy=-+spd.value*Math.sin(a),r=[];for(let i=0;i<160;i++){let dx=planets[lev][0]-x,dy=planets[lev][1]-y,d=dx*dx+dy*dy+900;vx+=dx*170/d;vy+=dy*170/d;x+=vx;y+=vy;r.push([x,y]);if(x>900||y>470||y<0)break}return r}function draw(){ctx.clearRect(0,0,900,470);for(let i=0;i<60;i++){ctx.fillStyle='#ffffff55';ctx.fillRect(i*137%900,i*83%470,2,2)}ctx.fillStyle='#c66d57';ctx.beginPath();ctx.arc(...planets[lev],55,0,7);ctx.fill();ctx.fillStyle='#ffda70';ctx.beginPath();ctx.arc(...beacons[lev],18,0,7);ctx.fill();ctx.setLineDash([5,7]);ctx.strokeStyle='#efc37b';ctx.beginPath();ctx.moveTo(90,360);path().forEach(q=>ctx.lineTo(...q));ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#7be7e9';ctx.beginPath();ctx.arc(...p,9,0,7);ctx.fill();if(active)requestAnimationFrame(step)}function step(){let dx=planets[lev][0]-p[0],dy=planets[lev][1]-p[1],d=dx*dx+dy*dy+900;v[0]+=dx*170/d;v[1]+=dy*170/d;p[0]+=v[0];p[1]+=v[1];if(Math.hypot(dx,dy)<62){active=false;msg.textContent='撞上行星，失败'}if(Math.hypot(p[0]-beacons[lev][0],p[1]-beacons[lev][1])<25){active=false;ok=true;msg.textContent='信标抵达！进入下一关'}if(p[0]>900||p[0]<0||p[1]>470||p[1]<0){active=false;msg.textContent='飞出边界，失败'}draw()}fire.onclick=()=>{p=[90,360];let a=+ang.value*Math.PI/180;v=[+spd.value*Math.cos(a),-+spd.value*Math.sin(a)];active=true;ok=false;step()};reset.onclick=()=>{p=[90,360];active=false;ok=false;msg.textContent='第'+(lev+1)+'关';draw()};next.onclick=()=>{if(ok){lev=(lev+1)%3;reset.onclick();msg.textContent='第'+(lev+1)+'关'}};draw();</script>
