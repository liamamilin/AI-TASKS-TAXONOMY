<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kepler Clock</title><style>body{margin:0;background:#101921;color:#e8e9df;font:15px system-ui;text-align:center}header{padding:10px}canvas{width:min(94vw,900px);height:min(72vh,620px);background:#101b2b;border-radius:18px}button,select{padding:9px;margin:4px;border:0;border-radius:8px;background:#e1af67;color:#17202a}</style><header><h1>Kepler Clock</h1><p>Orbital rates follow relative sidereal periods; speed control is illustrative.</p><label>Time rate <input id="rate" type="range" min=".2" max="4" step=".1" value="1"></label><canvas id="c" width="900" height="620"></canvas><script>let c=document.querySelector('canvas'),x=c.getContext('2d'),t=0,ps=[['Mercury',.4,88,'#aaa'],['Venus',.7,225,'#d4a46e'],['Earth',1,365,'#54a7e8'],['Mars',1.35,687,'#ed7155'],['Jupiter',2,4333,'#d5b07e'],['Saturn',2.7,10759,'#e0ce9a']];function f(){t+=+document.querySelector('#rate').value;x.fillStyle='#080f1d';x.fillRect(0,0,900,620);x.save();x.translate(450,310);x.fillStyle='#ffd873';x.beginPath();x.arc(0,0,25,0,7);x.fill();for(let [name,r,period,color] of ps){let R=r*78,a=t*2*Math.PI/period;x.strokeStyle='rgba(150,170,195,.25)';x.beginPath();x.ellipse(0,0,R,R*.72,0,0,7);x.stroke();x.fillStyle=color;x.beginPath();x.arc(Math.cos(a)*R,Math.sin(a)*R*.72,Math.max(5,13-r*2),0,7);x.fill()}x.restore();requestAnimationFrame(f)}f()</script></header>
