<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>棱光玻璃</title><style>*{box-sizing:border-box}body{margin:0;background:#101c28;color:#edf1e9;font:15px system-ui;display:grid;grid-template-columns:260px 1fr;height:100vh}aside{padding:24px;background:#162635}canvas{width:100%;height:100%}input{width:100%}button{padding:10px;border:0;border-radius:8px;background:#ddb06b;color:#17242b}</style><aside><h1>棱光玻璃</h1><p>球形折射、RGB 色散、菲涅尔边缘与程序棋盘焦散。</p><label>IOR <span id="v">1.48</span><input id="ior" type="range" min="1.05" max="2.1" value="1.48" step=".01"></label><p>拖动旋转视角</p></aside><canvas id="c"></canvas><script>let c=document.querySelector('canvas'),g=c.getContext('webgl');let vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';let fs='precision highp float;uniform vec2 r;uniform float tm,ior,rot;void main(){vec2 q=(gl_FragCoord.xy-.5*r)/r.y;vec3 ro=vec3(3.*sin(rot),.6,3.*cos(rot)),rd=normalize(vec3(q,-1.8));float h=dot(ro,rd);float d=h*h-dot(ro,ro)+1.;vec3 col=vec3(.07,.13,.2)+.2*max(rd.y,0.);if(d>0.&&h<0.){vec3 p=ro-rd*(h+sqrt(d)),n=normalize(p);float edge=pow(1.-abs(dot(n,-rd)),4.);vec3 refr=refract(rd,n,1./ior);float k=mod(floor((p.x+refr.x)*4.)+floor((p.z+refr.z)*4.),2.);float ca=exp(-30.*length(p.xz-vec2(.2*sin(tm),.2*cos(tm))));col=mix(vec3(.8,.78,.68),vec3(.13,.18,.21),k);col=mix(col,vec3(1.,.57,.25),ca*.7);col=mix(col,vec3(.55,.82,1.),edge*.85);col.r+=.06*(ior-1.4);col.b+=.06*(2.-ior);}gl_FragColor=vec4(col,1.);}';function shader(t,s){let x=g.createShader(t);g.shaderSource(x,s);g.compileShader(x);return x}let p=g.createProgram();g.attachShader(p,shader(g.VERTEX_SHADER,vs));g.attachShader(p,shader(g.FRAGMENT_SHADER,fs));g.linkProgram(p);g.useProgram(p);let b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);let a=g.getAttribLocation(p,'p');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);let ang=0,down=false,last=0;c.onpointerdown=e=>{down=true;last=e.clientX};onpointerup=()=>down=false;c.onpointermove=e=>{if(down){ang+=(e.clientX-last)*.008;last=e.clientX}};let i=document.querySelector('#ior');i.oninput=()=>document.querySelector('#v').textContent=i.value;function draw(t){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;g.viewport(0,0,c.width,c.height);g.uniform2f(g.getUniformLocation(p,'r'),c.width,c.height);g.uniform1f(g.getUniformLocation(p,'tm'),t/1000);g.uniform1f(g.getUniformLocation(p,'ior'),+i.value);g.uniform1f(g.getUniformLocation(p,'rot'),ang);g.drawArrays(g.TRIANGLE_STRIP,0,4);requestAnimationFrame(draw)}requestAnimationFrame(draw);</script>
