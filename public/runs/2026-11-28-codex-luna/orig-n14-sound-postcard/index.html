<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声音明信片</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#eef5f5;color:#17252b}main{max-width:760px;margin:8vh auto;background:white;padding:36px;border-radius:24px}button{font-size:18px;padding:13px 20px;background:#293958;color:white;border:0;border-radius:12px}.cues{display:grid;gap:10px;margin:25px 0}article{padding:15px;background:#f5efe1;border-radius:12px}audio{width:100%}</style><main><h1>门铃—脚步—开信</h1><p>按下播放后聆听一封夜行的声音明信片。</p><button id="play">▶ 播放声音明信片</button><div class="cues"><article><b>0.5–1.3 秒 · 门铃</b><p>两声轻门铃，像有人在夜里试探着敲门。</p></article><article><b>2–4 秒 · 脚步</b><p>四个脚步依次走近，每一步相隔半秒。</p></article><article><b>5–7 秒 · 开信</b><p>纸封被轻轻拆开，沙沙声渐渐落下。</p></article></div><audio controls preload="none" src="postcard.wav"></audio></main><script>document.querySelector('#play').onclick=()=>document.querySelector('audio').play();</script></html>
