<!doctype html><meta charset="utf-8"><title>泡茶计时板</title><style>body{font:18px system-ui;background:#f4f0e5;color:#283d35;padding:30px}main{max-width:850px;margin:auto}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}article{background:white;padding:22px;border-radius:18px;box-shadow:0 5px 20px #39493315}output{font-size:35px;display:block;margin:12px 0}button{font:inherit;border:0;border-radius:8px;background:#32755d;color:white;padding:10px 20px;cursor:pointer}#done{font-size:25px;color:#247553}</style><main><h1>一壶茶 · 计时板</h1><p id="done"></p><section id="timers"></section></main><script>let tasks=[['烧水',480],['洗杯',120],['找茶叶',60]],state=tasks.map(([name,total])=>({name,total,left:total,run:false,done:false})),el=document.querySelector('#timers');function fmt(n){return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function render(){el.innerHTML=state.map((t,i)=>`<article><b>${t.name}</b><output>${fmt(t.left)}</output><button onclick="start(${i})">${t.done?'已结束':t.run?'进行中':'开始'}</button></article>`).join('');document.querySelector('#done').textContent=state.every(t=>t.done)?'可以泡了':''}window.start=i=>{if(!state[i].done)state[i].run=true;render()};setInterval(()=>{state.forEach(t=>{if(t.run&&t.left>0)t.left--;if(t.run&&t.left===0){t.run=false;t.done=true}});render()},1000);render()</script>
