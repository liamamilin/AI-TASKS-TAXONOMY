<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Undertide · storm city</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07121c}canvas{width:100%;height:100%;display:block}</style><canvas></canvas><script>const c=document.querySelector('canvas'),g=c.getContext('webgl');let v=g.createShader(g.VERTEX_SHADER);g.shaderSource(v,'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}');g.compileShader(v);let f=g.createShader(g.FRAGMENT_SHADER);g.shaderSource(f,`precision highp float;uniform vec2 r;uniform float t;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float tower(vec2 p){vec2 id=floor(p);vec2 q=fract(p)-.5;float h=.4+hash(id)*1.5;float body=step(abs(q.x),.25+hash(id+3.)*.08)*step(q.y,-.5+h*.35)*step(-.5,q.y);float spire=step(abs(q.x),.025)*step(q.y,.5-h*.35)*step(-.5+h*.35,q.y);float win=step(.38,hash(floor(p*vec2(8.,9.))+id));return max(body,spire)*(.45+.55*win);}void main(){vec2 uv=gl_FragCoord.xy/r;float horizon=.57;vec2 p=vec2((uv.x-.5)*5.,(horizon-uv.y)*4.);float wave=sin(uv.x*20.+t*1.4)*.018+sin(uv.x*7.-t)*.03;float water=step(uv.y,horizon+wave);float city=tower(p);vec3 sky=mix(vec3(.035,.08,.13),vec3(.17,.21,.27),uv.y);float rain=step(.992,hash(floor(gl_FragCoord.xy*.33)+floor(t*50.)));sky+=rain*.23;vec3 col=sky;col=mix(col,vec3(.025,.04,.055),city);vec3 sea=vec3(.015,.12,.17)+.03*sin(uv.x*45.+t*2.)*vec3(.6,1.,1.);col=mix(col,sea,water);col+=city*water*vec3(.14,.35,.3);gl_FragColor=vec4(col,1.);}`);g.compileShader(f);let pr=g.createProgram();g.attachShader(pr,v);g.attachShader(pr,f);g.linkProgram(pr);g.useProgram(pr);let b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);let a=g.getAttribLocation(pr,'p');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);function draw(t){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.viewport(0,0,c.width,c.height);g.uniform2f(g.getUniformLocation(pr,'r'),c.width,c.height);g.uniform1f(g.getUniformLocation(pr,'t'),t/1000);g.drawArrays(g.TRIANGLE_STRIP,0,4);requestAnimationFrame(draw)}requestAnimationFrame(draw)</script>
