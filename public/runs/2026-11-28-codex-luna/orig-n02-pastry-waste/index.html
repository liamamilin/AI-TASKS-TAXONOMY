<!doctype html><meta charset="utf-8"><title>点心余量看板</title><style>body{font:16px system-ui;max-width:920px;margin:35px auto;padding:0 20px;color:#283334;background:#f7f5ef}h1{color:#215b50}select,button{padding:9px;border-radius:8px;border:1px solid #bbc9c1}article{background:white;padding:18px;margin:12px 0;border-radius:12px}table{border-collapse:collapse;width:100%}td,th{padding:9px;border-bottom:1px solid #ddd;text-align:left}.bar{height:18px;background:#27866d;border-radius:8px;min-width:2px}small{color:#566}</style><h1>点心余量看板</h1><p>合成示例数据 · 剩余率分母为可计算制作量</p><label>日期 <select id="day"><option value="all">全部日期</option><option>2026-04-01</option><option>2026-04-02</option></select></label> <button id="download">下载当前 summary.json</button><section id="out"></section><script>const rows=[{day:'2026-04-01',item:'月牙饼',made:20,sold:15},{day:'2026-04-01',item:'星星酥',made:10,sold:10},{day:'2026-04-02',item:'月牙饼',made:12,sold:null},{day:'2026-04-02',item:'星星酥',made:16,sold:12}];function summary(){let r=rows.filter(x=>day.value==='all'||x.day===day.value),items=['月牙饼','星星酥'].map(item=>{let a=r.filter(x=>x.item===item),known=a.filter(x=>x.sold!==null),made=known.reduce((s,x)=>s+x.made,0),sold=known.reduce((s,x)=>s+x.sold,0),left=made-sold;return {item,made:known.length?made:null,knownSold:sold,left:known.length?left:null,rate:known.length?left+'/'+made:null,missing:a.length-known.length}});return {date:day.value,items,totalComputableRemaining:items.reduce((s,x)=>s+(x.left||0),0),missingRows:r.filter(x=>x.sold===null).length,rows:r}}function render(){let s=summary();out.innerHTML=s.items.map(x=>`<article><b>${x.item}</b><p>制作 ${x.made??'未知'} · 已知售出 ${x.knownSold} · 可计算剩余 ${x.left??'未知'} · 剩余率 ${x.rate?`${x.left/x.made*100}%（${x.left}/${x.made}）`:'未知'} · 缺测 ${x.missing} 行</p>${x.left===null?'':`<div style="display:flex;gap:10px;align-items:center"><span>0</span><div class="bar" style="width:${x.left*22}px"></div><b>${x.left} 个</b></div>`}</article>`).join('')+`<p>合计可计算剩余 ${s.totalComputableRemaining} 个；缺测 ${s.missingRows} 行。图表单位：个，横轴从0起。</p><h2>原始数据</h2><table><tr><th>日期</th><th>品类</th><th>制作</th><th>已售</th></tr>${s.rows.map(x=>`<tr><td>${x.day}</td><td>${x.item}</td><td>${x.made}</td><td>${x.sold??'缺测'}</td></tr>`).join('')}</table>`}day.onchange=render;download.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(summary(),null,2)],{type:'application/json'}));a.download='summary.json';a.click()};render();</script>
