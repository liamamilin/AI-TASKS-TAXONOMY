<!doctype html><meta charset="utf-8"><title>极光湖</title><style>*{box-sizing:border-box}body{margin:0;background:#030813;color:#eafff7;font:15px system-ui}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;top:20px;left:22px;background:#06151bc9;padding:18px 20px;border:1px solid #317d70;border-radius:16px;backdrop-filter:blur(8px)}h1{font-size:19px;margin:0 0 12px}label{display:block;margin:8px 0;color:#b8dbd4}input{width:180px;vertical-align:middle;accent-color:#64f3be}</style><canvas></canvas><aside><h1>极光湖 · Nocturne</h1><label>帷幕强度 <input id="power" type="range" min="0" max="2" step=".01" value="1"></label><label>流动速度 <input id="speed" type="range" min=".1" max="2" step=".01" value=".7"></label></aside><script>
const c=document.querySelector('canvas'),g=c.getContext('webgl');let p=`precision highp float;uniform vec2 R;uniform float T,P,S;uniform vec2 M;float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}void main(){vec2 uv=gl_FragCoord.xy/R;uv.x+=(M.x-.5)*.05;float y=uv.y;vec3 col=mix(vec3(.008,.02,.06),vec3(.035,.09,.14),y);float stars=step(.997,h(floor(uv*vec2(180.,100.))));col+=stars*(.4+.6*sin(T*3.+h(uv)*8.));float curtain=0.;for(int i=0;i<4;i++){float f=float(i);float line=.53+.12*sin(uv.x*8.+T*S*(.6+f*.17)+f*2.)+.035*sin(uv.x*23.-T*S);float band=exp(-pow((y-line)/(.018+f*.004),2.));curtain+=band*(.45+.55*sin(uv.x*12.+T+f));}vec3 aur=mix(vec3(.05,1.,.48),vec3(.62,.18,.95),.5+.5*sin(uv.x*5.+T*.4));col+=aur*curtain*P*.28;float mountain= .2+.04*sin(uv.x*18.)+.05*sin(uv.x*43.);if(y<mountain)col*=.1;float lake=exp(-pow((y-.14)/.1,2.));col+=lake*aur*(.09+.08*sin(uv.x*70.+T*2.))*P;gl_FragColor=vec4(col,1.);}`;let sh=g.createShader(g.FRAGMENT_SHADER);g.shaderSource(sh,p);g.compileShader(sh);let v=g.createShader(g.VERTEX_SHADER);g.shaderSource(v,'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}');g.compileShader(v);let pr=g.createProgram();g.attachShader(pr,v);g.attachShader(pr,sh);g.linkProgram(pr);g.useProgram(pr);let b=g.createBuffer();g.bindBuffer(g.ARRAY_BUFFER,b);g.bufferData(g.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),g.STATIC_DRAW);let a=g.getAttribLocation(pr,'a');g.enableVertexAttribArray(a);g.vertexAttribPointer(a,2,g.FLOAT,false,0,0);let U=n=>g.getUniformLocation(pr,n),mouse=[.5,.5];onmousemove=e=>mouse=[e.clientX/innerWidth,e.clientY/innerHeight];function draw(t){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;g.viewport(0,0,c.width,c.height);g.uniform2f(U('R'),c.width,c.height);g.uniform1f(U('T'),t/1000);g.uniform1f(U('P'),+power.value);g.uniform1f(U('S'),+speed.value);g.uniform2f(U('M'),...mouse);g.drawArrays(g.TRIANGLE_STRIP,0,4);requestAnimationFrame(draw)}requestAnimationFrame(draw)</script>
