<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>种子借还台</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#eef5f5;color:#17252b}main{max-width:850px;margin:35px auto;background:white;padding:30px;border-radius:20px}.notice{background:#fff1c7;padding:12px;border-radius:8px}#cards{display:flex;gap:15px}.card,section{padding:18px;background:#f0f7ef;border-radius:14px;margin:12px 0}button,select,input{padding:10px;margin:5px;border-radius:8px;border:1px solid #ccd}.card{flex:1;font-size:20px}</style><main><h1>种子借还台</h1><p class="notice">合成数据 · 仅保存在此浏览器本地 · 不记录姓名</p><div id="cards"></div><section><h2>记录一次借还</h2><select id="item"><option>豆星</option><option>月瓜</option></select><select id="type"><option value="borrow">借出</option><option value="return">归还</option></select><input id="qty" type="number" step="1" placeholder="数量"><button onclick="act()">提交</button><p id="msg"></p></section><h2>演示动作</h2><button onclick="demo(0)">1 借豆星 2</button><button onclick="demo(1)">2 再借豆星 2（预期拒绝）</button><button onclick="demo(2)">3 归还月瓜 2</button><button onclick="undo()">4 撤销最后有效动作</button><button onclick="download()">下载 ledger.json</button><button onclick="reset()">重置</button><div id="events"></div></main><script>const initial={'豆星':3,'月瓜':1};let state,actions,undone;function load(){let s=JSON.parse(localStorage.getItem('ledger')||'null');if(s){state=s.state;actions=s.actions;undone=s.undone||[]}else reset(false);draw()}function save(){localStorage.setItem('ledger',JSON.stringify({state,actions,undone}));draw()}function draw(){document.querySelector('#cards').innerHTML=Object.entries(state).map(([k,v])=>`<div class="card">${k} <b>${v}</b><details><summary>相关事件</summary>${actions.filter(a=>a.item===k).map(a=>`<p>${a.type==='borrow'?'借':'还'} ${a.qty}</p>`).join('')}</details></div>`).join('');document.querySelector('#events').innerHTML='<h2>有效事件</h2>'+actions.map(a=>`<p>${a.type} ${a.item} × ${a.qty}</p>`).join('')+'<h3>撤销说明</h3>'+undone.map(a=>`<p>已撤销 ${a.type} ${a.item} × ${a.qty}</p>`).join('')}function apply(type,item,qty){if(!Number.isSafeInteger(qty)||qty<=0){msg.textContent='拒绝：数量必须为正整数';return false}if(type==='borrow'&&state[item]<qty){msg.textContent='拒绝：库存不足；未记事件';return false}state[item]+=type==='borrow'?-qty:qty;actions.push({type,item,qty});msg.textContent='已记入有效事件';save();return true}function act(){apply(type.value,item.value,Number(qty.value))}function demo(n){if(n===0)apply('borrow','豆星',2);if(n===1)apply('borrow','豆星',2);if(n===2)apply('return','月瓜',2)}function undo(){let a=actions.pop();if(!a){msg.textContent='没有可撤销动作';return}state[a.item]+=a.type==='borrow'?a.qty:-a.qty;undone.push(a);msg.textContent='只撤销了最后一个有效动作';save()}function reset(persist=true){state={...initial};actions=[];undone=[];if(persist)localStorage.removeItem('ledger');draw()}function download(){let data={initial,events:actions,current:state,undoMarkers:undone,derivedByReplay:replay()};let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)]));a.download='ledger.json';a.click()}function replay(){let s={...initial};for(let a of actions)s[a.item]+=a.type==='borrow'?-a.qty:a.qty;return s}load();</script></html>
