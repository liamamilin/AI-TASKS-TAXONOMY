<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blockshore</title><style>body{margin:0;background:#101922;color:#eff3e9;font:15px system-ui;display:grid;grid-template-columns:250px 1fr;height:100vh}aside{padding:22px;background:#192631}canvas{width:100%;height:100%;image-rendering:pixelated}button{padding:9px 12px;margin:4px;background:#345c4c;color:white;border:0;border-radius:7px;cursor:pointer}.help{line-height:1.6;color:#b8c8c3}</style><aside><h1>Blockshore</h1><p class="help">小型方块建造沙盒<br>← → 移动光标<br>点击地面放置 / 右键挖除<br>数字键选择方块</p><button onclick="tool=0">草地 1</button><button onclick="tool=1">沙地 2</button><button onclick="tool=2">水 3</button><p id="msg">已选草地</p></aside><canvas></canvas><script>let c=document.querySelector('canvas'),x=c.getContext('2d'),cols=16,rows=11,tiles=Array.from({length:rows},(_,y)=>Array.from({length:cols},(_,i)=>y>6?0:y===6?i%5?0:1:y===5&&i>9?2:3)),cursor=[7,6],tool=0,colors=['#5a9861','#d8ba71','#4c9aaa','#344752'];function draw(){requestAnimationFrame(draw);let w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=c.clientWidth;h=c.clientHeight;x.fillStyle='#9fc9d1';x.fillRect(0,0,w,h);let s=Math.min(w/(cols+4),h/(rows+3)),ox=(w-cols*s)/2,oy=(h-rows*s)/2;for(let y=0;y<rows;y++)for(let i=0;i<cols;i++){let xx=ox+i*s,yy=oy+y*s;x.fillStyle=colors[tiles[y][i]];x.fillRect(xx,yy,s-2,s-2);x.fillStyle='#ffffff18';x.fillRect(xx,yy,s-2,4);if(tiles[y][i]===2){x.fillStyle='#b8eff055';x.fillRect(xx+5,yy+8,s*.38,3)}}x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(ox+cursor[0]*s,oy+cursor[1]*s,s-2,s-2)}c.onclick=e=>{let s=Math.min(c.clientWidth/(cols+4),c.clientHeight/(rows+3)),ox=(c.clientWidth-cols*s)/2,oy=(c.clientHeight-rows*s)/2;let i=Math.floor((e.offsetX-ox)/s),y=Math.floor((e.offsetY-oy)/s);if(i>=0&&i<cols&&y>=0&&y<rows){tiles[y][i]=tool;cursor=[i,y]}};c.oncontextmenu=e=>{e.preventDefault();let s=Math.min(c.clientWidth/(cols+4),c.clientHeight/(rows+3)),i=Math.floor((e.offsetX-(c.clientWidth-cols*s)/2)/s),y=Math.floor((e.offsetY-(c.clientHeight-rows*s)/2)/s);if(i>=0&&i<cols&&y>=0&&y<rows)tiles[y][i]=3};onkeydown=e=>{if(e.key==='ArrowLeft')cursor[0]=Math.max(0,cursor[0]-1);if(e.key==='ArrowRight')cursor[0]=Math.min(cols-1,cursor[0]+1);if('123'.includes(e.key)){tool=+e.key-1;msg.textContent='已选'+['草地','沙地','水'][tool]}};requestAnimationFrame(draw)</script>
