<!doctype html><meta charset="utf-8"><title>和弦庭院</title><style>body{margin:0;background:#10151d;color:#f5f1e8;font:16px system-ui;padding:32px}h1{font-size:28px}.keys{display:grid;grid-template-columns:repeat(4,minmax(90px,1fr));gap:12px;max-width:700px;margin:30px 0}button,select{padding:16px;border:1px solid #5c6878;background:#1b2633;color:white;border-radius:12px;font:inherit;cursor:pointer}button:hover{background:#28544d}label{display:block;margin:14px 0}.scope{width:min(700px,100%);height:100px;background:#080d13;border:1px solid #455}</style><h1>和弦庭院</h1><canvas class="scope" width="700" height="100"></canvas><div class="keys"></div><label>音色 <select id="wave"><option>triangle</option><option>sine</option><option>sawtooth</option></select></label><label>低通截止频率 <input id="cut" type="range" min="150" max="7000" value="2400"> <output>2400 Hz</output></label><button id="auto">▶ 自动轮播</button><script>let names=['C 大调','Am','F','G','Dm','Em','Bb','Cmaj7'],notes=[[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7],[146.8,174.6,220],[164.8,196,246.9],[233.1,293.7,349.2],[261.6,329.6,392,493.9]],box=document.querySelector('.keys');names.forEach((n,i)=>{let b=document.createElement('button');b.textContent=(i+1)+' · '+n;b.onclick=()=>play(i);box.append(b)});let ctx,an,filter;function play(i){ctx??=new AudioContext();filter??=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=cut.value;an??=ctx.createAnalyser();an.fftSize=1024;filter.connect(an);an.connect(ctx.destination);notes[i].forEach((f,j)=>{let o=ctx.createOscillator(),gain=ctx.createGain();o.type=wave.value;o.frequency.value=f;gain.gain.setValueAtTime(.001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.09,ctx.currentTime+.04);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.3);o.connect(gain).connect(filter);o.start();o.stop(ctx.currentTime+1.35)})}onkeydown=e=>{if('12345678'.includes(e.key))play(+e.key-1)};cut.oninput=()=>{document.querySelector('output').value=cut.value+' Hz';if(filter)filter.frequency.value=cut.value};let timer;auto.onclick=()=>{if(timer){clearInterval(timer);timer=null;auto.textContent='▶ 自动轮播'}else{let i=0;play(i++);timer=setInterval(()=>play(i++%8),1500);auto.textContent='■ 停止轮播'}};let c=document.querySelector('canvas').getContext('2d'),data=new Uint8Array(1024);function draw(){requestAnimationFrame(draw);if(!an)return;an.getByteTimeDomainData(data);c.clearRect(0,0,700,100);c.strokeStyle='#65e6b9';c.beginPath();data.forEach((v,i)=>{let x=i/1024*700,y=v/255*100;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}draw()</script>
