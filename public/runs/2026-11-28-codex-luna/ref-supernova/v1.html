<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Starfall · Supernova</title><style>body{margin:0;background:#101921;color:#e8e9df;font:15px system-ui;text-align:center}header{padding:10px}canvas{width:min(94vw,900px);height:min(72vh,620px);background:#101b2b;border-radius:18px}button,select{padding:9px;margin:4px;border:0;border-radius:8px;background:#e1af67;color:#17202a}</style><header><h1>Starfall · Supernova</h1><p>A stellar core collapses, blooms, and leaves a glowing remnant.</p><canvas id="c" width="900" height="620"></canvas><script>let c=document.querySelector('canvas'),x=c.getContext('2d'),stars=Array.from({length:620},()=>[Math.random()*900,Math.random()*620,Math.random()*1.5]),t=0;function f(){t++;x.fillStyle='#070b18';x.fillRect(0,0,900,620);for(let s of stars){x.fillStyle='rgba(180,205,255,.7)';x.fillRect(s[0],s[1],s[2],s[2])}let phase=t%500,rad=phase<180?4+phase*1.3:Math.max(2,238-(phase-180)*1.2);let g=x.createRadialGradient(450,310,2,450,310,rad);g.addColorStop(0,'#fffbd5');g.addColorStop(.15,'#ffe78a');g.addColorStop(.5,'#ff725d');g.addColorStop(1,'rgba(129,55,175,0)');x.fillStyle=g;x.beginPath();x.arc(450,310,rad,0,7);x.fill();for(let i=0;i<50;i++){let a=i*2.4+phase*.05,rr=phase*1.2%250;x.fillStyle='rgba(255,180,120,.45)';x.fillRect(450+Math.cos(a)*rr,310+Math.sin(a)*rr,2,2)}requestAnimationFrame(f)}f()</script></header>
