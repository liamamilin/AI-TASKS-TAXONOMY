<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问笺馆 · 排班器</title><style>body{font:16px system-ui;background:#f4f0e8;color:#28291f;margin:0;padding:24px}main{max-width:950px;margin:auto}.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}.box{background:white;padding:18px;border-radius:14px;margin:12px 0}button{padding:10px 15px;background:#344b42;color:white;border:0;border-radius:8px;margin:4px}label{display:inline-block;margin:8px}pre{white-space:pre-wrap}</style><main><h1>问笺馆 · 离线排班</h1><p>四班各两人，每班至少一位钥匙员；每人最多两班且不可连班。</p><section class="cols"><div class="box"><h2>人员可用性</h2><div id="people"></div><button id="generate">生成排班</button><button id="clear">清空结果</button></div><div class="box"><h2>排班与检查</h2><div id="out">尚未生成</div><button id="download">下载 roster.json</button></div></section></main><script>const slots=[['S1','09:00–10:00'],['S2','10:00–11:00'],['S3','11:00–12:00'],['S4','12:00–13:00']], people=[{id:'甲',key:true,available:['S1','S3']},{id:'乙',key:true,available:['S2','S4']},{id:'丙',key:false,available:['S1','S4']},{id:'丁',key:false,available:['S2','S3']},{id:'戊',key:false,available:['S1','S3']},{id:'己',key:false,available:['S2','S4']}];let result=null;function renderPeople(){document.querySelector('#people').innerHTML=people.map((p,i)=>`<p>${p.id} ${p.key?'🔑':''}: `+slots.map(s=>`<label><input type="checkbox" data-p="${i}" value="${s[0]}" ${p.available.includes(s[0])?'checked':''}>${s[0]}</label>`).join('')+'</p>').join('');document.querySelectorAll('[data-p]').forEach(x=>x.onchange=()=>{let a=people[x.dataset.p].available;if(x.checked){if(!a.includes(x.value))a.push(x.value)}else people[x.dataset.p].available=a.filter(v=>v!==x.value)})}function solve(){let assign=slots.map(()=>[]),count=Array(people.length).fill(0);function rec(s){if(s===4)return true;for(let a=0;a<people.length;a++)for(let b=a+1;b<people.length;b++){let pair=[a,b];if(!pair.some(i=>people[i].key)||pair.some(i=>!people[i].available.includes(slots[s][0])||count[i]>=2||(s&&assign[s-1].includes(i))))continue;assign[s]=pair;pair.forEach(i=>count[i]++);if(rec(s+1))return true;pair.forEach(i=>count[i]--);assign[s]=[]}return false}return rec(0)?assign:null}function generate(){let a=solve();if(!a){result=null;document.querySelector('#out').innerHTML='<b>无解</b>：钥匙员可用性不足，无法满足每班至少一名钥匙员（检查 S1/S3）。';return}result={slots:slots.map((s,i)=>({id:s[0],time:s[1],people:a[i].map(j=>people[j].id)})),checks:{allSlotsTwo:true,keyEach:true,availability:true,maxTwo:true,noAdjacent:true}};document.querySelector('#out').innerHTML='<pre>'+JSON.stringify(result,null,2)+'</pre><p>✓ 每班2人 · ✓ 每班有钥匙员 · ✓ 可用性 · ✓ 每人≤2班 · ✓ 无相邻班</p>'}renderPeople();document.querySelector('#generate').onclick=generate;document.querySelector('#clear').onclick=()=>{result=null;document.querySelector('#out').textContent='已清空'};document.querySelector('#download').onclick=()=>{if(!result)return alert('请先生成排班');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));a.download='roster.json';a.click()};generate();</script>
