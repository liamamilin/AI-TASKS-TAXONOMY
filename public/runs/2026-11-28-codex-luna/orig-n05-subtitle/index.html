<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字幕校时台</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#eef5f5;color:#17252b}main{max-width:850px;margin:40px auto;background:#fff;padding:32px;border-radius:22px}input[type=range]{width:100%}.cue{padding:25px;background:#17252b;color:white;font-size:25px;border-radius:16px;margin:15px 0}button{padding:11px;background:#176c66;color:white;border:0;border-radius:8px;margin:6px}pre{background:#f4f6f4;padding:15px;white-space:pre-wrap}</style><main><h1>字幕校时台</h1><p>离线演示 · 游标显示活动字幕</p><label>校正量（毫秒） <input id="delta" type="number" value="-700"></label> <button onclick="render()">重新计算</button><label>时间游标 <input id="time" type="range" min="0" max="8" step="0.1" value="0"></label><output id="t">0.0 s</output><div id="active"></div><div class="actions"><button onclick="dl('corrected.srt',srt)">下载 SRT</button><button onclick="dl('corrected.vtt',vtt)">下载 VTT</button><button onclick="dl('report.json',JSON.stringify(report,null,2))">下载报告</button></div><h2>修正预览</h2><pre id="preview"></pre><h2>报告</h2><pre id="rep"></pre></main><script>const raw="1\n00:00:00,100 --> 00:00:00,500\n片头\n\n2\n00:00:01,000 --> 00:00:03,000\n小纸船出发了\n\n3\n00:00:02,800 --> 00:00:04,000\n风把它吹向窗边\n\n4\n00:00:05,000 --> 00:00:07,000\n<i>这是原样文字</i>\n";let cues=[],report={},srt='',vtt='';function ms(s){let [h,m,x]=s.replace('.',',').split(':');let [sec,mmm]=x.split(',');return ((+h*60 + +m)*60 + +sec)*1000 + +(mmm||0)}function stamp(n,dot=false){n=Math.max(0,n);let h=Math.floor(n/3600000),m=Math.floor(n/60000)%60,s=Math.floor(n/1000)%60,ms=n%1000;return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+(dot?'.':',')+String(ms).padStart(3,'0')}function render(){let delta=Number(document.querySelector('#delta').value)||0;let blocks=raw.trim().split(/\n\s*\n/),all=blocks.map(b=>{let l=b.split(/\n/),m=l[1].match(/(.+) --> (.+)/);return {orig:+l[0],start:ms(m[1])+delta,end:ms(m[2])+delta,text:l.slice(2).join('\n')}}),dropped=all.filter(c=>Math.max(0,c.end)<=Math.max(0,c.start)).map(c=>({original:c.orig,reason:'corrected end <= start'}));cues=all.filter(c=>!dropped.some(d=>d.original===c.orig)).map(c=>({...c,start:Math.max(0,c.start),end:Math.max(0,c.end)})).sort((a,b)=>a.start-b.start);let overlaps=[];for(let i=0;i<cues.length;i++)for(let j=i+1;j<cues.length;j++){let n=Math.min(cues[i].end,cues[j].end)-Math.max(cues[i].start,cues[j].start);if(n>0)overlaps.push({originalEntries:[cues[i].orig,cues[j].orig],overlapMs:n})}srt=cues.map((c,i)=>`${i+1}\n${stamp(c.start)} --> ${stamp(c.end)}\n${c.text}`).join('\n\n')+'\n';vtt='WEBVTT\n\n'+cues.map(c=>`${stamp(c.start,true)} --> ${stamp(c.end,true)}\n${c.text}`).join('\n\n')+'\n';report={delta_ms:delta,dropped,overlaps};document.querySelector('#preview').textContent=srt;document.querySelector('#rep').textContent=JSON.stringify(report,null,2);tick()}function tick(){let t=Number(document.querySelector('#time').value)*1000;document.querySelector('#t').value=(t/1000).toFixed(1)+' s';let active=cues.filter(c=>c.start<=t&&t<c.end);document.querySelector('#active').replaceChildren(...(active.length?active.map(c=>{let d=document.createElement('div');d.className='cue';d.textContent=c.text;return d}):[Object.assign(document.createElement('div'),{textContent:'此刻没有活动字幕'})]))}function dl(n,s){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s]));a.download=n;a.click()}document.querySelector('#time').oninput=tick;render();</script></html>
