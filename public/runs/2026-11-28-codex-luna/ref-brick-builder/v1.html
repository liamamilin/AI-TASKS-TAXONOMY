<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Block Atelier</title><style>body{margin:0;background:#101921;color:#e8e9df;font:15px system-ui;text-align:center}header{padding:10px}canvas{width:min(94vw,900px);height:min(72vh,620px);background:#101b2b;border-radius:18px}button,select{padding:9px;margin:4px;border:0;border-radius:8px;background:#e1af67;color:#17202a}<script>let c=document.querySelector('canvas'),x=c.getContext('2d'),blocks=[],rot=0,remove=false,angle=0,down=null;function draw(){x.fillStyle='#111b27';x.fillRect(0,0,900,620);x.save();x.translate(450,320);x.rotate(angle);for(let i=-5;i<=5;i++)for(let j=-5;j<=5;j++){let px=(i-j)*32,py=(i+j)*17;x.fillStyle=(i+j)%2?'#344b55':'#3b5660';x.beginPath();x.moveTo(px,py);x.lineTo(px+32,py+17);x.lineTo(px,py+34);x.lineTo(px-32,py+17);x.closePath();x.fill();x.strokeStyle='#536d75';x.stroke()}blocks.forEach(b=>{let px=(b.i-b.j)*32,py=(b.i+b.j)*17-b.h*20,wide=+b.w;x.fillStyle=b.c;x.beginPath();x.moveTo(px,py);x.lineTo(px+32*wide,py+17*wide);x.lineTo(px+32*wide,py+17*wide-20);x.lineTo(px,py-20);x.closePath();x.fill();x.fillStyle='#f09073';for(let n=0;n<wide;n++){x.beginPath();x.ellipse(px+16+n*32,py-21+n*8,8,4,0,0,7);x.fill()}});x.restore();requestAnimationFrame(draw)}draw();c.onclick=e=>{if(down)return;let i=Math.round((e.offsetX-450)/64),j=Math.round((e.offsetY-320)/34);if(remove){blocks=blocks.filter(b=>Math.abs(b.i-i)>0||Math.abs(b.j-j)>0)}else blocks.push({i,j,h:blocks.filter(b=>b.i===i&&b.j===j).length,w:document.querySelector('#size').value,c:document.querySelector('#col').value})};document.querySelector('#rot').onclick=()=>angle+=Math.PI/8;document.querySelector('#mode').onclick=e=>{remove=!remove;e.target.textContent='Remove mode: '+(remove?'on':'off')};document.querySelector('#clear').onclick=()=>blocks=[];c.onpointerdown=e=>down=e.clientX;c.onpointerup=()=>down=null;c.onpointermove=e=>{if(down!==null){angle+=(e.clientX-down)*.003;down=e.clientX}};</script></style><header><h1>Block Atelier</h1><label>Brick <select id="size"><option value="1">1×1</option><option value="2">2×1</option><option value="3">2×2</option></select></label><label>Color <input id="col" type="color" value="#dd654e"></label><button id="rot">Rotate</button><button id="mode">Remove mode: off</button><button id="clear">Clear</button><p>Click the baseplate to snap a block. Drag to orbit.</p><canvas id="c" width="900" height="620"></canvas></header>
