<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neon Circuit</title><style>*{box-sizing:border-box}body{margin:0;background:#13152d;color:#fff;font:15px system-ui}main{max-width:1000px;margin:auto;padding:14px}header{display:flex;align-items:center;gap:20px;flex-wrap:wrap}h1{color:#ffcb61;letter-spacing:.15em}button{padding:10px 18px;border:0;border-radius:9px;background:#eb6c86;color:white;font-weight:bold}output{margin-left:auto;font-size:22px;color:#8ffff0}canvas{width:100%;background:#101b34;border:1px solid #384668;border-radius:20px}</style><main><header><h1>NEON CIRCUIT</h1><p>Arrow keys / WASD to steer and accelerate · Three laps</p><button onclick="start()">Start / Restart</button><output id="hud">Lap 1 · 00:00</output></header><canvas id="c" width="900" height="620"></canvas></main><script>let x=c.getContext('2d'),keys={},pos=0,spd=0,lap=1,go=false,startAt=0,off=0;onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;function start(){pos=0;spd=0;lap=1;off=0;go=true;startAt=performance.now();draw()}function draw(){if(!go)return;let w=900,h=620;x.clearRect(0,0,w,h);x.fillStyle='#284739';x.fillRect(0,0,w,h);x.strokeStyle='#5c637e';x.lineWidth=160;x.setLineDash([]);x.beginPath();x.ellipse(450,310,320,220,0,0,7);x.stroke();x.strokeStyle='#f8e6a7';x.lineWidth=3;x.setLineDash([22,18]);x.beginPath();x.ellipse(450,310,320,220,0,0,7);x.stroke();x.setLineDash([]);for(let i=0;i<16;i++){let a=i*Math.PI/8;x.fillStyle=i%2?'#fff':'#f45a70';x.fillRect(450+Math.cos(a)*395-5,310+Math.sin(a)*290-5,10,10)}if(keys.arrowup||keys.w)spd=Math.min(5,spd+.08);else spd*=.987;if(keys.arrowdown||keys.s)spd=Math.max(-2,spd-.1);if(keys.arrowleft||keys.a)pos-=spd*.004;if(keys.arrowright||keys.d)pos+=spd*.004;off+=spd;let a=pos-Math.PI/2,rx=450+Math.cos(a)*320,ry=310+Math.sin(a)*220;x.save();x.translate(rx,ry);x.rotate(a+Math.PI/2);x.fillStyle='#f55076';x.beginPath();x.roundRect(-17,-29,34,58,9);x.fill();x.fillStyle='#b9f6e7';x.fillRect(-12,-15,24,15);x.restore();if(off>1500){off=0;lap++;if(lap>3){go=false;hud.textContent='FINISH!';return}}hud.textContent='Lap '+lap+' · '+((performance.now()-startAt)/1000).toFixed(1)+' s';requestAnimationFrame(draw)}</script>
