<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Red Horizon · Mission Plot</title><style>body{margin:0;background:#101921;color:#e8e9df;font:15px system-ui;text-align:center}header{padding:10px}canvas{width:min(94vw,900px);height:min(72vh,620px);background:#101b2b;border-radius:18px}button,select{padding:9px;margin:4px;border:0;border-radius:8px;background:#e1af67;color:#17202a}</style><header><h1>Red Horizon · Mission Plot</h1><p>Earth departure → Mars landing → return at the next launch window.</p><button id="play">Pause / play</button><canvas id="c" width="900" height="620"></canvas><script>let c=document.querySelector('canvas'),x=c.getContext('2d'),t=0,go=true;play.onclick=()=>go=!go;function f(){if(go)t+=.004;x.fillStyle='#101b2b';x.fillRect(0,0,900,620);let E=[230,320],M=[670,300];x.fillStyle='#4a97e6';x.beginPath();x.arc(...E,40,0,7);x.fill();x.fillStyle='#df725b';x.beginPath();x.arc(...M,32,0,7);x.fill();x.fillStyle='white';x.fillText('EARTH',190,390);x.fillText('MARS',645,365);x.strokeStyle='#7995ac';x.setLineDash([5,8]);x.beginPath();x.moveTo(...E);x.quadraticCurveTo(460,120,...M);x.quadraticCurveTo(850,520,...E);x.stroke();x.setLineDash([]);let u=t%2,pos=u<1?[E[0]+(M[0]-E[0])*u,E[1]+(M[1]-E[1])*u-150*Math.sin(Math.PI*u)]:[M[0]+(E[0]-M[0])*(u-1),M[1]+(E[1]-M[1])*(u-1)-130*Math.sin(Math.PI*(u-1))];x.fillStyle='#f6dc85';x.beginPath();x.arc(...pos,8,0,7);x.fill();x.fillText(u<.5?'Outbound burn':u<1?'Mars landing':u<1.5?'Wait for launch window':'Return burn',350,560);requestAnimationFrame(f)}f()</script></header>
