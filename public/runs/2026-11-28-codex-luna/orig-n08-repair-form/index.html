<!doctype html><meta charset="utf-8"><title>木芽维修咖啡馆 · 登记演示</title><style>body{font:16px system-ui;background:#f2f0e9;color:#233;padding:26px}main{max-width:700px;margin:auto;background:white;padding:28px;border-radius:18px}label{display:block;margin:16px 0 5px}input,select,textarea,button{font:inherit;padding:9px;border:1px solid #89968e;border-radius:7px}input,textarea{width:95%}button{cursor:pointer;background:#205d4e;color:white} :focus-visible{outline:3px solid #e69c39} .err{color:#b21f28}#summary{color:#b21f28}</style><main><h1>木芽维修咖啡馆</h1><p>虚构、离线登记演示。只处理无危险手工物品；不提供维修建议。</p><form id="f" novalidate><div id="summary" role="alert" aria-live="polite"></div><label for="item">物品名称（必填，最多40字）</label><input id="item" maxlength="100" aria-describedby="eitem"><div id="eitem" class="err"></div><label for="category">类别</label><select id="category"><option>纸品</option><option>布艺</option><option>其他</option></select><label for="hazard">是否有危险（必选）</label><select id="hazard"><option value="">请选择</option><option>是</option><option>否</option></select><div id="ehazard" class="err"></div><label for="note">备注（选填，最多100字）</label><textarea id="note" maxlength="140" aria-describedby="enote"></textarea><div id="enote" class="err"></div><button>检查并分流</button></form><section id="result" hidden><h2>登记结果</h2><p id="route"></p><button id="save">下载 receipt.json</button> <button id="back">返回修改</button></section></main><script>const f=document.querySelector('#f'),item=document.querySelector('#item'),hazard=document.querySelector('#hazard'),note=document.querySelector('#note');let receipt;f.onsubmit=e=>{e.preventDefault();let errors=[];eitem.textContent=item.value.trim()?item.value.length>40?'请缩短至40字以内。':'':'请填写物品名称。';ehazard.textContent=hazard.value?'':'请选择是否有危险。';enote.textContent=note.value.length>100?'请缩短至100字以内。':'';if(eitem.textContent)errors.push('物品名称：'+eitem.textContent);if(ehazard.textContent)errors.push('危险项：'+ehazard.textContent);if(enote.textContent)errors.push('备注：'+enote.textContent);summary.textContent=errors.length?'请检查：'+errors.join(' '):'';if(errors.length){(eitem.textContent?item:hazard).focus();return}let route,id;if(hazard.value==='是'){route='不接收：此演示只处理无危险手工物品';id='HAZARD_REJECT'}else if(category.value==='纸品'){route='纸艺桌';id='PAPER_TABLE'}else if(category.value==='布艺'){route='缝补桌';id='TEXTILE_TABLE'}else{route='咨询桌';id='OTHER_DESK'}receipt={input:{item:item.value,category:category.value,hazard:hazard.value,note:note.value},routing:route,rule_id:id};f.hidden=true;result.hidden=false;document.querySelector('#route').textContent=route};back.onclick=()=>{result.hidden=true;f.hidden=false;item.focus()};save.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(receipt,null,2)],{type:'application/json'}));a.download='receipt.json';a.click()}</script>
