<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>离线数据清洗台</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#eef5f5;color:#17252b}main{max-width:1050px;margin:30px auto;padding:30px;background:white;border-radius:20px}textarea{display:block;width:100%;font:14px ui-monospace;padding:12px}button{padding:10px 16px;margin:10px 4px;background:#176c66;color:white;border:0;border-radius:8px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #b9ceca;padding:8px}pre{white-space:pre-wrap}</style><main><h1>离线数据清洗台</h1><p>数据仅在此浏览器本地处理。</p><label>原始 CSV <textarea id="raw" rows="9"></textarea></label><button onclick="clean()">清洗</button><div class="grid"><section><h2>规范化结果</h2><div id="table"></div><button onclick="download('cleaned.csv',csv,'text/csv')">下载 cleaned.csv</button></section><section><h2>问题清单</h2><pre id="issues"></pre><button onclick="download('issues.json',JSON.stringify(problems,null,2),'application/json')">下载 issues.json</button></section></div></main><script>const seed="id,item,date,zone,count\n A01 ,\"纸伞,蓝色\",2026/04/01,东门,1\nA02,手套,2026-04-02,West,0\nA01,\"纸伞,蓝色\",2026-04-03,East,2\nA03,围巾,04/05/26,西门,\nA04,帽子,2026-02-30,北门,-1\n";document.querySelector('#raw').value=seed;let csv='',problems=[];function parse(s){let rows=[],r=[],f='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){f+='"';i++}else if(c==='"')q=false;else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'){r.push(f);rows.push(r);r=[];f=''}else if(c!=='\r')f+=c}if(f||r.length){r.push(f);rows.push(r)}return rows}function esc(s){s=String(s);return /[",\n\r]/.test(s)?'"'+s.replaceAll('"','""')+'"':s}function clean(){let rows=parse(document.querySelector('#raw').value),map=new Map();problems=[];rows.slice(1).forEach((r,i)=>{if(!r.some(x=>x.trim()))return;let line=i+2,id=(r[0]||'').trim();if(map.has(id))problems.push({field:'id',value:id,sourceRow:line,issue:'replacedRow',replacedSourceRow:map.get(id).line});map.set(id,{r,line})});let out=[['id','item','date','zone','count']];for(let [id,o] of map){let r=o.r;let date=(r[2]||'').trim(),m=date.match(/^(\d{4})[-/](\d\d)[-/](\d\d)$/);if(m){let d=new Date(+m[1],+m[2]-1,+m[3]);if(d.getFullYear()!==+m[1]||d.getMonth()!==+m[2]-1||d.getDate()!==+m[3])m=null}let normDate=m?`${m[1]}-${m[2]}-${m[3]}`:'';if(!m)problems.push({field:'date',value:r[2]||'',sourceRow:o.line,issue:'invalid date'});let z=(r[3]||'').trim(),zone=(z==='东门'||z==='East')?'East':(z==='西门'||z==='West')?'West':'unknown';if(zone==='unknown')problems.push({field:'zone',value:r[3]||'',sourceRow:o.line,issue:'unknown zone'});let cv=(r[4]||'').trim(),count=/^\d+$/.test(cv)?String(Number(cv)):'';if(count===''||!Number.isSafeInteger(Number(cv))) {count='';problems.push({field:'count',value:r[4]||'',sourceRow:o.line,issue:'invalid or missing count'})}out.push([id,(r[1]||'').trim(),normDate,zone,count])}csv=out.map(r=>r.map(esc).join(',')).join('\r\n')+'\r\n';document.querySelector('#table').innerHTML='<table><tr>'+out[0].map(x=>'<th>'+x+'</th>').join('')+'</tr>'+out.slice(1).map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('');document.querySelector('#issues').textContent=JSON.stringify(problems,null,2)}function download(n,c,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}clean();</script></html>
