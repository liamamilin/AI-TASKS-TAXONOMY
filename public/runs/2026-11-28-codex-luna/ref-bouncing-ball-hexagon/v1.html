<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Well</title><style>body{margin:0;background:#101921;color:#e8e9df;font:15px system-ui;text-align:center}header{padding:10px}canvas{width:min(94vw,900px);height:min(72vh,620px);background:#101b2b;border-radius:18px}button,select{padding:9px;margin:4px;border:0;border-radius:8px;background:#e1af67;color:#17202a}</style><header><h1>Orbit Well</h1><p>Spin · gravity · wall friction</p><canvas id="c" width="900" height="620"></canvas><script>let c=document.querySelector('canvas'),x=c.getContext('2d'),t=0;let b={x:0,y:-30,vx:3,vy:0,r:14};function f(){x.clearRect(0,0,900,620);x.save();x.translate(450,310);let a=t*.008,R=230,pts=Array.from({length:6},(_,i)=>[Math.cos(a+i*Math.PI/3)*R,Math.sin(a+i*Math.PI/3)*R]);x.strokeStyle='#71d6ce';x.lineWidth=5;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.closePath();x.stroke();b.vy+=.12;b.x+=b.vx;b.y+=b.vy;for(let i=0;i<6;i++){let p=pts[i],q=pts[(i+1)%6],dx=q[0]-p[0],dy=q[1]-p[1],L=Math.hypot(dx,dy),nx=dy/L,ny=-dx/L,dist=(b.x-p[0])*nx+(b.y-p[1])*ny;if(dist>b.r){b.x-=nx*(dist-b.r);b.y-=ny*(dist-b.r);let wallV=(a?R*a*.008:0),vn=b.vx*nx+b.vy*ny;if(vn>0){b.vx-=1.86*vn*nx;b.vy-=1.86*vn*ny;b.vx*=.995;b.vy*=.995}}}x.fillStyle='#ffcc73';x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.restore();t++;requestAnimationFrame(f)}f()</script></header>
