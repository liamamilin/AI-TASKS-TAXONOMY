<!doctype html><meta charset="utf-8"><title>口袋资料夹</title><style>body{font:16px system-ui;background:#f4f2ec;color:#263b35;max-width:1050px;margin:25px auto;padding:0 20px}.wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}article{background:white;border-radius:12px;padding:15px;margin:10px 0}button,input,select{font:inherit;padding:9px;border:1px solid #abbab2;border-radius:8px}button{cursor:pointer}small{color:#536}</style><h1>口袋资料夹</h1><p>仅检索这六条原始便签。AND 搜索 · 本地离线</p><input id="q" placeholder="关键词：按空格分词"> <select id="tag"><option>全部</option><option>活动</option><option>库存</option><option>规则</option></select> <button id="export">导出当前 results.json</button><h2>检索结果</h2><div id="res"></div><h2>并排比较（最多两条）</h2><div class="wrap" id="pins"></div><h2>全部原文</h2><div id="all"></div><script>const notes=[["C1","活动","纸船会","周六 10:00 在蓝厅折纸。"],["C2","库存","蓝纸","蓝厅剩蓝纸12张，日期04-01。"],["C3","活动","换书角","周日 14:00 在黄厅交换旧书。"],["C4","规则","纸船规则","蓝厅纸船不可放入水池。"],["C5","库存","彩笔","黄厅有彩笔3盒。"],["C6","规则","换书规则","旧书不可夹带食品。"]];let pinned=[];function card(n,button=true){let a=document.createElement('article'),h=document.createElement('b'),p=document.createElement('p'),s=document.createElement('small');h.textContent=n.title+' · '+n.id;p.textContent=n.body;s.textContent='标签：'+n.tag;a.append(h,p,s);if(button){let b=document.createElement('button');b.textContent=pinned.includes(n.id)?'取消固定':'固定比较';b.onclick=()=>{if(pinned.includes(n.id))pinned=pinned.filter(x=>x!==n.id);else if(pinned.length<2)pinned.push(n.id);render()};a.append(document.createElement('br'),b)}return a}function render(){let terms=q.value.toLowerCase().trim().split(/\s+/).filter(Boolean),result=notes.filter(n=>(tag.value==='全部'||tag.value===n.tag)&&terms.every(t=>(n.title+' '+n.body).toLowerCase().includes(t)));res.replaceChildren(...result.map(n=>card(n)));all.replaceChildren(...notes.map(n=>card(n,false)));pins.replaceChildren(...pinned.map(id=>card(notes.find(n=>n.id===id),false)));window.current={query:q.value,tag:tag.value,ids:result.map(n=>n.id),notes:result}}q.oninput=tag.onchange=render;export.onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(current,null,2)],{type:'application/json'}));a.download='results.json';a.click()};render()</script>
