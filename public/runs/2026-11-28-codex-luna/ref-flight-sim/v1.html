<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skyline Vector</title><style>*{box-sizing:border-box}body{margin:0;background:#7ac4d5;overflow:hidden}canvas{width:100vw;height:100vh;display:block}.hud{position:fixed;top:16px;left:20px;display:flex;gap:24px;color:white;text-shadow:0 2px 5px #123;align-items:center}.hud b{font-size:21px}output{padding:8px;background:#1237;border:1px solid #cff}#reticle{position:fixed;left:50%;top:50%;font-size:30px;color:white}</style><canvas id="c"></canvas><div class="hud"><b>SKYLINE VECTOR</b><span>W/S pitch · A/D steer · hold ↑ accelerate</span><output id="alt">ALT 1200</output></div><div id="reticle">＋</div><script>let x=c.getContext('2d'),keys={},yaw=0,pit=0,spd=1,bs=[];for(let i=0;i<100;i++)bs.push({x:(Math.random()-.5)*2300,z:Math.random()*4800+200,y:Math.random()*90});onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;function draw(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);let w=innerWidth,h=innerHeight,hor=h*.52+pit*130;x.fillStyle='#77c8dc';x.fillRect(0,0,w,hor);x.fillStyle='#c4d9b4';x.fillRect(0,hor,w,h-hor);bs.forEach(b=>{b.z-=spd*5;if(b.z<50){b.z=5000;b.x=(Math.random()-.5)*2200}let X=w/2+(b.x-yaw*900)*420/b.z,Y=hor+(b.y+pit*250)*420/b.z,S=420/b.z*48;if(X>-100&&X<w+100){x.fillStyle='#647b7d';x.fillRect(X-S/2,Y-S*2,S,S*2);x.fillStyle='#edd89d';for(let yy=Y-S*1.8;yy<Y;yy+=S*.32)x.fillRect(X-S*.25,yy,S*.12,S*.1)}});if(keys.a)yaw-=.02;if(keys.d)yaw+=.02;if(keys.w)pit=Math.min(.5,pit+.006);if(keys.s)pit=Math.max(-.5,pit-.006);spd=keys.arrowup?2.3:1;alt.textContent='ALT '+Math.round(1200-pit*400);requestAnimationFrame(draw)}draw();</script>
