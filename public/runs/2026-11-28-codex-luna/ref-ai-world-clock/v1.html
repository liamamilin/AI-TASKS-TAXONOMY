<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fff;font:14px system-ui;color:#39464b}.clock{width:min(78vw,390px);aspect-ratio:1;border:9px solid #25313a;border-radius:50%;position:relative;box-shadow:0 14px 40px #21333b20}.clock:before{content:'';position:absolute;inset:8%;border:1px solid #dbe2e1;border-radius:50%}.n{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:19px}.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:8px}.hour{width:8px;height:25%;background:#24353b;transform:translateX(-50%) rotate(305deg)}.minute{height:35%;width:5px;background:#607a7d;transform:translateX(-50%) rotate(60deg)}.second{height:40%;width:2px;background:#d56f56;animation:sec 60s steps(60) infinite;transform:translateX(-50%)}.pin{position:absolute;width:13px;height:13px;border-radius:50%;background:#d56f56;top:50%;left:50%;transform:translate(-50%,-50%)}@keyframes sec{to{transform:translateX(-50%) rotate(360deg)}}</style></head><body><div class="clock"><span class="n" style="left:50%;top:9%">12</span><span class="n" style="left:90%;top:50%">3</span><span class="n" style="left:50%;top:91%">6</span><span class="n" style="left:10%;top:50%">9</span><i class="hand hour"></i><i class="hand minute"></i><i class="hand second"></i><i class="pin"></i></div></body></html>
