<!doctype html><meta charset="utf-8"><title>风筝纸工坊</title><style>body{font:16px system-ui;background:#f5efe4;padding:24px;color:#332d26}main{max-width:850px;margin:auto}.box{background:white;border-radius:14px;padding:20px;margin:12px 0}button{padding:9px;margin:4px}</style><main><h1>风筝纸工坊</h1><button id="old">原版</button><button id="new">修订版</button><label>人数<input id="n" type="number" value="12"></label><label>每人纸张<input id="pp" type="number" value="3"></label><button id="dl">下载 revised.json</button><button id="log">下载 change-log.json</button><p><button data-v="公告">公告</button><button data-v="流程表">流程表</button><button data-v="物资单">物资单</button></p><section class="box" id="out"></section><section class="box" id="changes"></section></main><script>
const O={"title": "风筝纸工坊", "date": "2026-04-18", "place": "云尾室", "host_id": "HOST-SYN-01", "people": 8, "paper_per_person": 3, "paper_in_stock": 10, "schedule": [{"name": "签到", "start": "10:00", "minutes": 10}, {"name": "制作", "start": "10:10", "minutes": 40}, {"name": "收拾", "start": "10:50", "minutes": 10}]},R={"title": "风筝纸工坊", "date": "2026-04-18", "place": "云尾室", "host_id": "HOST-SYN-01", "people": 12, "paper_per_person": 3, "paper_in_stock": 10, "schedule": [{"name": "签到", "start": "10:30", "minutes": 10}, {"name": "制作", "start": "10:40", "minutes": 50}, {"name": "收拾", "start": "11:30", "minutes": 10}]},L=[{"field": "人数", "before": 8, "after": 12, "kind": "直接"}, {"field": "开始时间", "before": "10:00", "after": "10:30", "kind": "顺延30分钟"}, {"field": "制作时长", "before": 40, "after": 50, "kind": "直接"}, {"field": "总纸张", "before": 24, "after": 36, "kind": "衍生"}, {"field": "需补纸张", "before": 14, "after": 26, "kind": "衍生"}];let version='R',view='公告';const $=s=>document.querySelector(s);function time(t,d){let [h,m]=t.split(':').map(Number),v=h*60+m+d;return String(v/60|0).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}function obj(){let x=JSON.parse(JSON.stringify(version==='O'?O:R));if(version==='R')x.people=+$(':#n');return x}function draw(){let x=JSON.parse(JSON.stringify(version==='O'?O:R));if(version==='R'){x.people=+$('#n').value;x.paper_per_person=+$('#pp').value}let out=$('#out');out.textContent=x.title+' · '+x.date+' · '+x.place+' · '+x.people+'人 · '+x.host_id+' | '+view+'：';if(view==='流程表')out.textContent+=x.schedule.map(a=>a.name+' '+a.start+'–'+time(a.start,a.minutes)).join(' / ');else if(view==='物资单')out.textContent+='总需 '+(x.people*x.paper_per_person)+'，库存10，需补 '+Math.max(0,x.people*x.paper_per_person-10);else out.textContent+='活动公告：'+x.title+' 于 '+x.date+' 在 '+x.place+' 举行。';$('#changes').textContent=L.map(a=>a.kind+' · '+a.field+': '+a.before+' → '+a.after).join('；')}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{view=b.dataset.v;draw()});$('#old').onclick=()=>{version='O';draw()};$('#new').onclick=()=>{version='R';draw()};$('#n').oninput=$('#pp').oninput=draw;function dl(n,o){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download=n;a.click()}$('#dl').onclick=()=>{let x=JSON.parse(JSON.stringify(R));x.people=+$('#n').value;x.paper_per_person=+$('#pp').value;x.paper_needed=x.people*x.paper_per_person;x.paper_to_buy=Math.max(0,x.paper_needed-10);dl('revised.json',x)};$('#log').onclick=()=>dl('change-log.json',L);draw();</script>
