<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hypercube Drift</title><style>body{margin:0;background:#101921;color:#e8e9df;font:15px system-ui;text-align:center}header{padding:10px}canvas{width:min(94vw,900px);height:min(72vh,620px);background:#101b2b;border-radius:18px}button,select{padding:9px;margin:4px;border:0;border-radius:8px;background:#e1af67;color:#17202a}</style><header><h1>Hypercube Drift</h1><p>A luminous ball ricochets inside a rotating projected tesseract.</p><canvas id="c" width="900" height="620"></canvas><script>let c=document.querySelector('canvas'),x=c.getContext('2d'),t=0,b=[.1,.2,.15],v=[.013,.017,.019];function f(){t+=.01;x.fillStyle='#091323';x.fillRect(0,0,900,620);let pts=[];for(let i=0;i<16;i++){let a=[];for(let k=0;k<4;k++)a.push((i>>k&1)?1:-1);let [X,Y,Z,W]=a;let u=X*Math.cos(t)-W*Math.sin(t),w=X*Math.sin(t)+W*Math.cos(t);let q=Y*Math.cos(t*.73)-Z*Math.sin(t*.73),z=Y*Math.sin(t*.73)+Z*Math.cos(t*.73);let scale=150/(2.8+w*.35);pts.push([450+scale*(u+q*.5),310+scale*(z+q*.32)])}x.strokeStyle='#6acdda';x.lineWidth=2;for(let i=0;i<16;i++)for(let k=0;k<4;k++){let j=i^(1<<k);if(j>i){x.beginPath();x.moveTo(...pts[i]);x.lineTo(...pts[j]);x.stroke()}}for(let i=0;i<3;i++){b[i]+=v[i];if(Math.abs(b[i])>.78)v[i]*=-1}let sc=130/(2.8+b[3]*.35);x.fillStyle='#ffd275';x.shadowColor='#79e9ff';x.shadowBlur=25;x.beginPath();x.arc(450+sc*(b[0]+b[1]*.5),310+sc*(b[2]+b[1]*.32),14,0,7);x.fill();x.shadowBlur=0;requestAnimationFrame(f)}f()</script></header>
