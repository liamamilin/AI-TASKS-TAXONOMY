<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三灯机关</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#eef5f5;color:#17252b}main{max-width:680px;margin:12vh auto;background:white;padding:40px;border-radius:28px;box-shadow:0 20px 60px #15404020;text-align:center}#lamps{display:flex;justify-content:center;gap:32px;padding:34px}.lamp{width:76px;height:110px;border-radius:45% 45% 35% 35%;background:#36434a;border:8px solid #526269;transition:.2s;box-shadow:inset 0 -15px 0 #2229}.lamp.on{background:#ffdc70;box-shadow:0 0 40px #ffba49,inset 0 -15px 0 #f39b30}button{margin:8px;padding:13px 22px;border:0;border-radius:12px;background:#156f71;color:white;font-weight:bold;cursor:pointer}</style><main><h1>三灯机关</h1><p>按规则切换灯组，找出所有灯亮起的路径。</p><section id="lamps"><div class="lamp"></div><div class="lamp"></div><div class="lamp"></div></section><div class="buttons"><button onclick="toggle(0,1)">A · 1+2</button><button onclick="toggle(1,2)">B · 2+3</button><button onclick="toggle(0,2)">C · 1+3</button></div><p id="status">三盏灯均已熄灭</p><button onclick="reset()">重置</button></main><script>let s=[0,0,0];function draw(){document.querySelectorAll('.lamp').forEach((e,i)=>e.classList.toggle('on',!!s[i]));document.querySelector('#status').textContent=s.map(x=>x?'亮':'灭').join(' · ')}function toggle(a,b){s[a]^=1;s[b]^=1;draw()}function reset(){s=[0,0,0];draw()}</script></html>
