<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chromatic Cube</title><style>body{margin:0;background:#101921;color:#e8e9df;font:15px system-ui;text-align:center}header{padding:10px}canvas{width:min(94vw,900px);height:min(72vh,620px);background:#101b2b;border-radius:18px}button,select{padding:9px;margin:4px;border:0;border-radius:8px;background:#e1af67;color:#17202a}<script>let c=document.querySelector('canvas'),x=c.getContext('2d'),moves=['U','U′','D','D′','L','L′','R','R′','F','F′','B','B′'],history=[],turns=Array(6).fill(0),t=0;let ctr=document.querySelector('#controls');moves.forEach(m=>{let b=document.createElement('button');b.textContent=m;b.onclick=()=>turn(m);ctr.append(b)});function turn(m){let f='UDLRFB'.indexOf(m[0]);turns[f]+=m.includes('′')?-1:1;history.push(m);status.textContent=' turns '+history.length}scramble.onclick=()=>{history=[];for(let i=0;i<12;i++)turn(moves[Math.random()*12|0])};solve.onclick=()=>{let timer=setInterval(()=>{if(!history.length){clearInterval(timer);return}let m=history.pop(),inv=m.endsWith('′')?m[0]:m[0]+'′';let f='UDLRFB'.indexOf(m[0]);turns[f]+=m.endsWith('′')?1:-1;history.pop();status.textContent=' unwinding · '+history.length},500)};let colors=['#fff','#ffd52f','#e94545','#ff8b2e','#38a66b','#3182cf'];function f(){t+=.012;x.fillStyle='#111b29';x.fillRect(0,0,900,620);let cells=[];for(let z=-1;z<=1;z++)for(let y=-1;y<=1;y++)for(let xx=-1;xx<=1;xx++){let X=xx,Y=y,Z=z;let a=t*.3;let q=X*Math.cos(a)-Z*Math.sin(a),w=X*Math.sin(a)+Z*Math.cos(a);let scale=48/(3+w*.25);cells.push({xx,yy:y,zz:z,q,w,X:450+scale*(q+Y*.45),Y:300+scale*(Y*.85-w*.25),s:scale})}cells.sort((a,b)=>a.w-b.w);for(let d of cells){let s=d.s*.85;let face=(val,i)=>colors[(i+Math.abs(val+1))%6];x.fillStyle=face(d.xx,0);x.beginPath();x.moveTo(d.X,d.Y);x.lineTo(d.X+s*.85,d.Y+s*.28);x.lineTo(d.X+s*.85,d.Y+s*1.1);x.lineTo(d.X,d.Y+s*.82);x.closePath();x.fill();x.strokeStyle='#14191e';x.lineWidth=3;x.stroke();x.fillStyle=face(d.yy,1);x.beginPath();x.moveTo(d.X,d.Y);x.lineTo(d.X+s*.55,d.Y-s*.36);x.lineTo(d.X+s*1.4,d.Y-s*.08);x.lineTo(d.X+s*.85,d.Y+s*.28);x.closePath();x.fill();x.stroke();x.fillStyle=face(d.zz,3);x.beginPath();x.moveTo(d.X+s*.85,d.Y+s*.28);x.lineTo(d.X+s*1.4,d.Y-s*.08);x.lineTo(d.X+s*1.4,d.Y+s*.74);x.lineTo(d.X+s*.85,d.Y+s*1.1);x.closePath();x.fill();x.stroke()}requestAnimationFrame(f)}f();</script></style><header><h1>Chromatic Cube</h1><p>27 cubies · face turn controls · scramble history unwinds every 500 ms</p><div id="controls"></div><button id="scramble">Scramble</button><button id="solve">Auto unscramble</button><span id="status"></span><canvas id="c" width="900" height="620"></canvas></header>
