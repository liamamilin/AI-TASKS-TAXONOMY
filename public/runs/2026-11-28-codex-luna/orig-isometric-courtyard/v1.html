<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雨巷庭院</title><style>*{box-sizing:border-box}body{margin:0;background:#101c28;color:#edf1e9;font:15px system-ui;display:grid;grid-template-columns:260px 1fr;height:100vh}aside{padding:24px;background:#162635}canvas{width:100%;height:100%}input{width:100%}button{padding:10px;border:0;border-radius:8px;background:#ddb06b;color:#17242b}</style><aside><h1>雨巷庭院</h1><p>拖动旋转微缩庭院。池塘涟漪，雨丝斜落。</p><button id="day">昼夜切换</button><button id="rain">雨势：开</button></aside><canvas id="c"></canvas><script>let c=document.querySelector('canvas'),x=c.getContext('2d'),ang=0,down=false,last=0,night=true,rain=true,t=0;c.onpointerdown=e=>{down=true;last=e.clientX};onpointerup=()=>down=false;c.onpointermove=e=>{if(down){ang+=(e.clientX-last)*.008;last=e.clientX}};document.querySelector('#day').onclick=()=>night=!night;document.querySelector('#rain').onclick=e=>{rain=!rain;e.target.textContent='雨势：'+(rain?'开':'关')};function frame(){c.width=c.clientWidth*devicePixelRatio;c.height=c.clientHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);let w=c.clientWidth,h=c.clientHeight;x.fillStyle=night?'#19292c':'#a3c6c4';x.fillRect(0,0,w,h);x.save();x.translate(w/2,h*.56);x.rotate(ang);function p(a,col){x.fillStyle=col;x.beginPath();a.forEach((v,i)=>i?x.lineTo(...v):x.moveTo(...v));x.closePath();x.fill()}p([[-230,0],[0,-125],[230,0],[0,125]],'#83958a');p([[-150,-4],[0,-86],[150,-4],[0,76]],'#516962');p([[-68,-3],[0,-41],[68,-3],[0,33]],'#34849a');for(let i=0;i<9;i++){x.strokeStyle='rgba(210,240,235,.55)';x.beginPath();x.ellipse(Math.sin(t*.02+i)*35,Math.cos(t*.02+i)*16,10+(t+i*4)%38,4+(i+t*.1)%14,0,0,7);x.stroke()}for(let s of [-1,1]){let z=s*116;p([[z-78,-27],[z,-84],[z+78,-27],[z+62,15],[z-62,15]],'#ddd0b4');for(let j=0;j<4;j++){x.strokeStyle='#303d42';x.lineWidth=5;x.beginPath();x.moveTo(z-76+j*30,-28-j*8);x.lineTo(z,-84-j*8);x.lineTo(z+76-j*30,-28-j*8);x.stroke()}x.fillStyle=night?'#ffc66b':'#fff0a8';x.beginPath();x.arc(z,20,8,0,7);x.fill()}p([[-80,12],[-45,-8],[-18,4],[4,26],[-28,28],[-57,18]],'#b18c61');x.restore();if(rain){x.strokeStyle='rgba(220,240,238,.3)';for(let i=0;i<120;i++){let xx=(i*83+t*.2)%w,yy=(i*47+t*.9)%h;x.beginPath();x.moveTo(xx,yy);x.lineTo(xx-7,yy+19);x.stroke()}}t++;requestAnimationFrame(frame)}requestAnimationFrame(frame);</script>
