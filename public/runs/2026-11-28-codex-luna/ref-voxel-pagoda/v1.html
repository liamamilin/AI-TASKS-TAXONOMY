<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雾樱 pagoda</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(#46575d,#101c28);color:#f1dfb5;font:15px system-ui}main{max-width:1100px;margin:20px auto;text-align:center}h1{font:46px Georgia;color:#ffd7a5;margin:5px}canvas{width:100%;height:650px;border-radius:22px;box-shadow:0 30px 80px #0009;cursor:grab}footer{letter-spacing:.3em;padding:12px;color:#9dd4c5}</style><main><header><small>庭园造景 · 方块工坊</small><h1>雾樱 pagoda</h1><p>Drag to orbit · Scroll to zoom</p></header><canvas id="c"></canvas><footer>雾桥 · 石灯 · 三重塔 · 樱花庭</footer></main><script>let x=c.getContext('2d'),yaw=0,zoom=1,drag=false,last=0;function cube(px,py,size,color){x.fillStyle=color;x.fillRect(px,py,size,size);x.fillStyle='rgba(255,255,255,.16)';x.beginPath();x.moveTo(px,py);x.lineTo(px+size*.2,py-size*.16);x.lineTo(px+size,py-size*.16);x.lineTo(px+size*.8,py);x.fill();x.fillStyle='rgba(0,0,0,.16)';x.fillRect(px+size*.8,py,size*.2,size)}function draw(){c.width=innerWidth*devicePixelRatio;c.height=650*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);let w=c.clientWidth,h=650;x.fillStyle='#aac9c2';x.fillRect(0,0,w,h);let grd=x.createLinearGradient(0,0,0,h);grd.addColorStop(.4,'#c5d8c7');grd.addColorStop(1,'#506d5e');x.fillStyle=grd;x.fillRect(0,h*.4,w,h*.6);for(let i=0;i<20;i++){let xx=((i*139+yaw*40)%w+w)%w, yy=270+(i*57)%270;cube(xx,yy,14,'#607d69')}let cx=w*.51,base=465,sz=zoom;for(let i=0;i<7;i++){let xx=cx-250+i*82+yaw*12;cube(xx,base+((i%3)*13),48,'#827b69')} // pagoda tiers
for(let tier=0;tier<3;tier++){let y=base-70-tier*92, width=(260-tier*48)*sz, left=cx-width/2;x.fillStyle='#703b39';x.fillRect(left+24,y,width-48,86);x.fillStyle=tier===0?'#d39b61':'#b26c4c';x.beginPath();x.moveTo(left-25,y);x.lineTo(cx,y-38);x.lineTo(left+width+25,y);x.lineTo(left+width,y+10);x.lineTo(left,y+10);x.fill();cube(cx-10,y-58,20,'#c59455');for(let wx=left+42;wx<left+width-25;wx+=46){x.fillStyle='#ffd995';x.fillRect(wx,y+25,18,28)}}for(let i=0;i<90;i++){let xx=(i*97+Math.sin(i+yaw)*25)%w,yy=70+(i*53)%450;x.fillStyle=i%3?'#f3b7bd':'#fff0ce';x.globalAlpha=.65;x.fillRect(xx,yy,5,5);x.globalAlpha=1}requestAnimationFrame(draw)}c.onmousedown=e=>{drag=true;last=e.clientX};onmouseup=()=>drag=false;onmousemove=e=>{if(drag){yaw+=(e.clientX-last)/15;last=e.clientX}};onwheel=e=>zoom=Math.max(.7,Math.min(1.4,zoom-e.deltaY*.0005));draw();</script>
